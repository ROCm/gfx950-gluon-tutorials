<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="Decision flow for a new tile: compute B and T; if T times C over B is under L the loop is bandwidth-bound with ceiling T C over B L; else if num_stages minus one times T is under L it is latency-bound, deepen the pipeline and re-test; else if it still waits read which instruction waits; else the gap is a scheduling problem.">
  <style>
    .h    { font-size: 12.5px; font-weight: 600; fill: #767676; }
    .lbl  { font-size: 11.5px; fill: #767676; }
    .lblb { font-size: 11.5px; font-weight: 600; fill: #767676; }
    .in   { font-size: 11px; fill: #1a1a1a; }
    .ins  { font-size: 10.5px; fill: #1a1a1a; }
    .inb  { font-size: 11.5px; font-weight: 600; fill: #1a1a1a; }
    .note { font-size: 11.5px; fill: #767676; }
    .bad  { font-size: 11.5px; fill: #c8443c; }
    .badb { font-size: 11.5px; font-weight: 600; fill: #c8443c; }
    .ok   { font-size: 11.5px; fill: #4c9a5a; }
    .okb  { font-size: 11.5px; font-weight: 600; fill: #4c9a5a; }
    .warn { font-size: 11.5px; fill: #d4a72c; }
    .warnb{ font-size: 11.5px; font-weight: 600; fill: #d4a72c; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; fill: #1a1a1a; }
    .monog{ font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; fill: #767676; }
    .idle { fill: #ececec; stroke: #b9b9b9; stroke-dasharray: 3 3; }
    .wire { fill: none; stroke: #767676; stroke-width: 1.2; }
    .dash { fill: none; stroke: #767676; stroke-width: 1; stroke-dasharray: 3 3; }
    .brk  { fill: none; stroke: #1a1a1a; stroke-width: 1; }
    .wireO{ fill: none; stroke: #d9822b; stroke-width: 1.4; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#767676"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8443c"/></marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d9822b"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="560" fill="#ffffff"/>
  <text class="h" x="8" y="16">The checklist as a flow. Two tests, then the trace tells you which one you failed.</text>
  <rect x="8" y="36" width="318" height="52" fill="#ffffff" stroke="#767676" rx="4"/>
  <text class="inb" x="167.0" y="58.0" text-anchor="middle">1.  B = A + B bytes per K tile</text>
  <text class="in" x="167.0" y="74.0" text-anchor="middle">T = 16 x MFMAs per wave per K tile</text>
  <line x1="167.0" y1="88" x2="167.0" y2="116" class="wire" marker-end="url(#arr)"/>
  <rect x="8" y="118" width="318" height="52" fill="#f7eec6" stroke="#d4a72c" rx="4"/>
  <text class="inb" x="167.0" y="140.0" text-anchor="middle">2.  T x C / B  ≥  L ?</text>
  <text class="in" x="167.0" y="156.0" text-anchor="middle">fp16, 16x16x32: 11 x BM x BN / (BM + BN)</text>
  <line x1="326" y1="144.0" x2="390" y2="144.0" class="wire" marker-end="url(#arr)"/>
  <text class="lbl" x="359.0" y="138.0" text-anchor="middle">no</text>
  <rect x="392" y="110" width="360" height="68" fill="#f7d2cf" stroke="#c8443c" rx="4"/>
  <text class="badb" x="572.0" y="132.0" text-anchor="middle">bandwidth-bound</text>
  <text class="in" x="572.0" y="148.0" text-anchor="middle">spread the loads; then the ceiling is T x C / (B x L).</text>
  <text class="in" x="572.0" y="164.0" text-anchor="middle">Levers: tile shape, element type, L. Not LDS buffers.</text>
  <line x1="167.0" y1="170" x2="167.0" y2="198" class="wire" marker-end="url(#arr)"/>
  <text class="lbl" x="175.0" y="189.0">yes</text>
  <rect x="8" y="200" width="318" height="52" fill="#f7eec6" stroke="#d4a72c" rx="4"/>
  <text class="inb" x="167.0" y="222.0" text-anchor="middle">3.  (num_stages − 1) x T  ≥  L ?</text>
  <text class="in" x="167.0" y="238.0" text-anchor="middle">with as many buffers as the LDS allows</text>
  <line x1="326" y1="226.0" x2="390" y2="226.0" class="wire" marker-end="url(#arr)"/>
  <text class="lbl" x="359.0" y="220.0" text-anchor="middle">no</text>
  <rect x="392" y="192" width="360" height="68" fill="#f7d2cf" stroke="#c8443c" rx="4"/>
  <text class="badb" x="572.0" y="214.0" text-anchor="middle">latency-bound</text>
  <text class="in" x="572.0" y="230.0" text-anchor="middle">deepen the pipeline, which moves the wait</text>
  <text class="in" x="572.0" y="246.0" text-anchor="middle">to the TCP cap: back to test 2's verdict.</text>
  <line x1="167.0" y1="252" x2="167.0" y2="280" class="wire" marker-end="url(#arr)"/>
  <text class="lbl" x="175.0" y="271.0">yes</text>
  <rect x="8" y="282" width="318" height="52" fill="#f7eec6" stroke="#d4a72c" rx="4"/>
  <text class="inb" x="167.0" y="304.0" text-anchor="middle">4.  still waiting on vmcnt?</text>
  <text class="in" x="167.0" y="320.0" text-anchor="middle">read the trace: which instruction waits?</text>
  <line x1="326" y1="308.0" x2="390" y2="308.0" class="wire" marker-end="url(#arr)"/>
  <text class="lbl" x="359.0" y="302.0" text-anchor="middle">yes</text>
  <rect x="392" y="274" width="360" height="68" fill="#f7d2cf" stroke="#c8443c" rx="4"/>
  <text class="bad" x="572.0" y="296.0" text-anchor="middle">a stretched buffer_load → the cap of test 2</text>
  <text class="bad" x="572.0" y="312.0" text-anchor="middle">a long s_waitcnt before the ds_reads</text>
  <text class="bad" x="572.0" y="328.0" text-anchor="middle">→ the depth of test 3</text>
  <line x1="167.0" y1="334" x2="167.0" y2="362" class="wire" marker-end="url(#arr)"/>
  <text class="lbl" x="175.0" y="353.0">no</text>
  <rect x="8" y="364" width="318" height="52" fill="#cde8d3" stroke="#4c9a5a" rx="4"/>
  <text class="okb" x="167.0" y="386.0" text-anchor="middle">5.  a scheduling problem</text>
  <text class="in" x="167.0" y="402.0" text-anchor="middle">the LLIR scheduler and the v7 → v9 steps apply</text>
  <text class="note" x="8" y="444">C = 44 KB per CU (one workgroup per CU). L ≈ 1000 cycles at L2-friendly K; it grows with the L2 miss rate,</text>
  <text class="note" x="8" y="460">so the verdicts are optimistic at large K. An 8-bit element type halves B at the same T: twice the budget.</text>
  <text class="lblb" x="8" y="484">Only when both tests pass is the remaining gap something a schedule can close.</text>
</svg>
