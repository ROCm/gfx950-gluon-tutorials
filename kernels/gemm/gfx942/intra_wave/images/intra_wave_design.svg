  <rect x="752.0" y="364" width="4" height="16" fill="#d4a72c"/>
  <rect x="775.0" y="364" width="4" height="16" fill="#d4a72c"/>
  <text class="in" x="616" y="402" xml:space="preserve">LR <tspan fill="#8a5aa8">B_left</tspan>(k+1)</text>
  <text class="in" x="616" y="418" xml:space="preserve">LW <tspan fill="#4d7cb8">A_bot</tspan>(k+1)</text>
  <text class="in" x="616" y="434" xml:space="preserve">GR <tspan fill="#4d7cb8">A_bot</tspan>(k+2)</text>
  <rect x="818" y="318" width="204" height="128" rx="2" fill="#cde8d3" stroke="#4c9a5a"/>
