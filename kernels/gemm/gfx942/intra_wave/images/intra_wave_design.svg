  <text class="in" x="828" y="354" xml:space="preserve">C_br += <tspan fill="#4d7cb8">A_bot</tspan> · <tspan fill="#3f8f87">B_right</tspan></text>
  <rect x="828" y="366" width="184" height="12" rx="2" fill="#b6dcc0"/>
  <rect x="849.0" y="364" width="4" height="16" fill="#d4a72c"/>
  <rect x="872.0" y="364" width="4" height="16" fill="#d4a72c"/>
  <rect x="895.0" y="364" width="4" height="16" fill="#d4a72c"/>
