  <rect x="563.0" y="364" width="4" height="16" fill="#d4a72c"/>
  <text class="in" x="404" y="402" xml:space="preserve">LR <tspan fill="#3f8f87">B_right</tspan>(k)</text>
  <text class="in" x="404" y="418" xml:space="preserve">LW <tspan fill="#b8556b">A_top</tspan>(k+1)</text>
  <text class="in" x="404" y="434" xml:space="preserve">GR <tspan fill="#b8556b">A_top</tspan>(k+2)</text>
  <rect x="606" y="318" width="204" height="128" rx="2" fill="#cde8d3" stroke="#4c9a5a"/>
