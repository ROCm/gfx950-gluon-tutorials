  <rect x="328.0" y="364" width="4" height="16" fill="#d4a72c"/>
  <rect x="351.0" y="364" width="4" height="16" fill="#d4a72c"/>
  <text class="in" x="192" y="402" xml:space="preserve">LR <tspan fill="#4d7cb8">A_bot</tspan>(k)</text>
  <text class="in" x="192" y="418" xml:space="preserve">LW <tspan fill="#8a5aa8">B_left</tspan>(k+1)</text>
  <text class="in" x="192" y="434" xml:space="preserve">GR <tspan fill="#8a5aa8">B_left</tspan>(k+2)</text>
  <rect x="394" y="318" width="204" height="128" rx="2" fill="#cde8d3" stroke="#4c9a5a"/>
  <text class="rn" x="402" y="333" xml:space="preserve">region 1</text>
  <text class="in" x="404" y="354" xml:space="preserve">C_bl += <tspan fill="#4d7cb8">A_bot</tspan> · <tspan fill="#8a5aa8">B_left</tspan></text>
  <rect x="404" y="366" width="184" height="12" rx="2" fill="#b6dcc0"/>
  <rect x="425.0" y="364" width="4" height="16" fill="#d4a72c"/>
