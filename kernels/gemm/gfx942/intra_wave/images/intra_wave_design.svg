  <text class="note" x="178" y="636" xml:space="preserve">Dashed lines: region boundaries. Triton's membar pass places the two barriers per K-step that the slot recycling</text>
  <text class="note" x="178" y="654" xml:space="preserve">needs, and Triton's MFMA scheduler spreads each region's memory ops through its 64 MFMAs to hide them.</text>
