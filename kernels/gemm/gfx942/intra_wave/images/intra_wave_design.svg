  <text class="in" x="828" y="418" xml:space="preserve">LW <tspan fill="#3f8f87">B_right</tspan>(k+1)</text>
  <text class="in" x="828" y="434" xml:space="preserve">GR <tspan fill="#3f8f87">B_right</tspan>(k+2)</text>
  <text class="sub" x="16" y="474" xml:space="preserve">LDS slots in iteration k</text>
