  <text class="in" x="616" y="354" xml:space="preserve">C_tr += <tspan fill="#b8556b">A_top</tspan> · <tspan fill="#3f8f87">B_right</tspan></text>
  <rect x="616" y="366" width="184" height="12" rx="2" fill="#b6dcc0"/>
