<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 548" width="1040" height="548" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <style>
    .h    { font-size: 13px; font-weight: 600; fill: #555; }
    .sub  { font-size: 12px; font-weight: 600; fill: #767676; }
    .lbl  { font-size: 12px; fill: #767676; }
    .dim  { font-size: 10.5px; fill: #8a8a8a; }
    .tile { font-size: 12px; font-weight: 600; }
    .in   { font-size: 11px; fill: #1a1a1a; }
    .rn   { font-size: 9.5px; fill: #767676; }
    .cyc  { font-size: 9.5px; fill: #8a8a8a; }
    .note { font-size: 11.5px; fill: #767676; }
    .em   { font-size: 11.5px; font-weight: 600; fill: #555; }
    .bar  { stroke: #b9b9b9; stroke-width: 1; stroke-dasharray: 2 3; }
  </style>
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#d6d6d6" stroke-width="2"/>
    </pattern>
  </defs>
  <text class="h" x="16" y="24" xml:space="preserve">inter_wave on gfx942 — 256×256×64 tile, 8 waves (2 per SIMD), two wave groups one region apart</text>
  <text class="sub" x="16" y="54" xml:space="preserve">Tile split</text>
  <text class="dim" x="140.0" y="72" text-anchor="middle" xml:space="preserve">128</text>
  <text class="dim" x="212.0" y="72" text-anchor="middle" xml:space="preserve">128</text>
  <text class="dim" x="96" y="100" text-anchor="end" xml:space="preserve">64</text>
  <text class="dim" x="70" y="124" text-anchor="middle" xml:space="preserve">64</text>
  <text class="dim" x="44" y="170.0" text-anchor="end" xml:space="preserve">128</text>
  <text class="dim" x="44" y="242.0" text-anchor="end" xml:space="preserve">128</text>
  <rect x="104" y="78" width="72" height="36" fill="#ece0f4" stroke="#8a5aa8"/><text class="tile" x="140.0" y="100.0" text-anchor="middle" xml:space="preserve" fill="#8a5aa8">B_l</text>
  <rect x="176" y="78" width="72" height="36" fill="#d8efec" stroke="#3f8f87"/><text class="tile" x="212.0" y="100.0" text-anchor="middle" xml:space="preserve" fill="#3f8f87">B_r</text>
  <rect x="52" y="130" width="36" height="72" fill="#f6dbe2" stroke="#b8556b"/><text class="tile" x="70.0" y="170.0" text-anchor="middle" xml:space="preserve" fill="#b8556b">A_t</text>
  <rect x="52" y="202" width="36" height="72" fill="#d9e6f6" stroke="#4d7cb8"/><text class="tile" x="70.0" y="242.0" text-anchor="middle" xml:space="preserve" fill="#4d7cb8">A_b</text>
  <rect x="104" y="130" width="72" height="72" fill="#fafafa" stroke="#9a9a9a"/><text class="tile" x="140.0" y="166.0" text-anchor="middle" xml:space="preserve" fill="#444">C_tl</text><text class="rn" x="140.0" y="181.0" text-anchor="middle" xml:space="preserve">region 1</text>
  <rect x="176" y="130" width="72" height="72" fill="#fafafa" stroke="#9a9a9a"/><text class="tile" x="212.0" y="166.0" text-anchor="middle" xml:space="preserve" fill="#444">C_tr</text><text class="rn" x="212.0" y="181.0" text-anchor="middle" xml:space="preserve">region 3</text>
  <rect x="104" y="202" width="72" height="72" fill="#fafafa" stroke="#9a9a9a"/><text class="tile" x="140.0" y="238.0" text-anchor="middle" xml:space="preserve" fill="#444">C_bl</text><text class="rn" x="140.0" y="253.0" text-anchor="middle" xml:space="preserve">region 5</text>
  <rect x="176" y="202" width="72" height="72" fill="#fafafa" stroke="#9a9a9a"/><text class="tile" x="212.0" y="238.0" text-anchor="middle" xml:space="preserve" fill="#444">C_br</text><text class="rn" x="212.0" y="253.0" text-anchor="middle" xml:space="preserve">region 7</text>
  <text class="sub" x="330" y="54" xml:space="preserve">Key</text>
  <rect x="330" y="66" width="26" height="16" fill="#f7eec6" stroke="#d4a72c"/><text class="lbl" x="364" y="79" xml:space="preserve">memory region</text>
  <rect x="480" y="66" width="26" height="16" fill="#cde8d3" stroke="#4c9a5a"/><text class="lbl" x="514" y="79" xml:space="preserve">dot region (32 MFMA, 512 cycles)</text>
  <rect x="760" y="66" width="26" height="16" fill="url(#hatch)" stroke="#c9c9c9"/><text class="lbl" x="794" y="79" xml:space="preserve">waits one region</text>
  <text class="note" x="330" y="108" xml:space="preserve">GR global read (buffer_load) · LR LDS read (local_load) · LW LDS write (local_store)</text>
  <text class="note" x="330" y="128" xml:space="preserve">[k] this K-step's tile · [k+1] the next one, prefetched · top-right number: cycles of the region</text>
  <text class="note" x="330" y="148" xml:space="preserve">GR / LW move whole tensors (A 256×64, B 64×256); LR and the dots work on the 128-wide halves</text>
  <text class="note" x="330" y="168" xml:space="preserve">LDS holds tile k only (64 KB, one stage): the registers holding GR [k+1] are the pipeline buffer</text>
  <text class="em" x="330" y="196" xml:space="preserve">Every memory region fits inside the dot region it ping-pongs against:</text>
  <text class="note" x="330" y="216" xml:space="preserve">256 / 128 / 384 / 256 cycles of LDS-port time under 512 cycles of MFMA.</text>
  <text class="sub" x="16" y="306" xml:space="preserve">One K-step (time →)</text>
  <text class="lbl" x="16" y="364.0" xml:space="preserve">waves 0–3</text>
  <text class="lbl" x="16" y="440.0" xml:space="preserve">waves 4–7</text>
  <rect x="96" y="328" width="124" height="140" fill="#f4f4f4" stroke="#b9b9b9"/>
  <text class="rn" x="104" y="343" xml:space="preserve">prologue, both groups</text>
  <text class="in" x="110" y="386" xml:space="preserve">GR A[0], B[0]</text>
  <text class="in" x="110" y="404" xml:space="preserve">LW A[0], B[0]</text>
  <text class="in" x="110" y="422" xml:space="preserve">LR <tspan fill="#8a5aa8">B_l</tspan>[0]</text>
  <line class="bar" x1="232" y1="322" x2="232" y2="474"/>
  <line class="bar" x1="320" y1="322" x2="320" y2="474"/>
  <line class="bar" x1="408" y1="322" x2="408" y2="474"/>
  <line class="bar" x1="496" y1="322" x2="496" y2="474"/>
  <line class="bar" x1="584" y1="322" x2="584" y2="474"/>
  <line class="bar" x1="672" y1="322" x2="672" y2="474"/>
  <line class="bar" x1="760" y1="322" x2="760" y2="474"/>
  <line class="bar" x1="848" y1="322" x2="848" y2="474"/>
  <line class="bar" x1="936" y1="322" x2="936" y2="474"/>
  <line class="bar" x1="1024" y1="322" x2="1024" y2="474"/>
  <g><rect x="234" y="328" width="84" height="64" rx="2" fill="#f7eec6" stroke="#d4a72c"/><text class="rn" x="240" y="341" xml:space="preserve">0 · mem</text><text class="cyc" x="313" y="341" text-anchor="end" xml:space="preserve">256</text><text class="in" x="242" y="363" xml:space="preserve">GR B[k+1]</text><text class="in" x="242" y="380" xml:space="preserve">LR <tspan fill="#b8556b">A_t</tspan>[k]</text></g>
  <g><rect x="322" y="404" width="84" height="64" rx="2" fill="#f7eec6" stroke="#d4a72c"/><text class="rn" x="328" y="417" xml:space="preserve">0 · mem</text><text class="cyc" x="401" y="417" text-anchor="end" xml:space="preserve">256</text><text class="in" x="330" y="439" xml:space="preserve">GR B[k+1]</text><text class="in" x="330" y="456" xml:space="preserve">LR <tspan fill="#b8556b">A_t</tspan>[k]</text></g>
  <g><rect x="322" y="328" width="84" height="64" rx="2" fill="#cde8d3" stroke="#4c9a5a"/><text class="rn" x="328" y="341" xml:space="preserve">1 · dot</text><text class="cyc" x="401" y="341" text-anchor="end" xml:space="preserve">512</text><text class="in" x="330" y="363" xml:space="preserve">C_tl +=</text><text class="in" x="330" y="380" xml:space="preserve"><tspan fill="#b8556b">A_t</tspan> · <tspan fill="#8a5aa8">B_l</tspan></text></g>
  <g><rect x="410" y="404" width="84" height="64" rx="2" fill="#cde8d3" stroke="#4c9a5a"/><text class="rn" x="416" y="417" xml:space="preserve">1 · dot</text><text class="cyc" x="489" y="417" text-anchor="end" xml:space="preserve">512</text><text class="in" x="418" y="439" xml:space="preserve">C_tl +=</text><text class="in" x="418" y="456" xml:space="preserve"><tspan fill="#b8556b">A_t</tspan> · <tspan fill="#8a5aa8">B_l</tspan></text></g>
  <g><rect x="410" y="328" width="84" height="64" rx="2" fill="#f7eec6" stroke="#d4a72c"/><text class="rn" x="416" y="341" xml:space="preserve">2 · mem</text><text class="cyc" x="489" y="341" text-anchor="end" xml:space="preserve">128</text><text class="in" x="418" y="363" xml:space="preserve">GR A[k+1]</text><text class="in" x="418" y="380" xml:space="preserve">LR <tspan fill="#3f8f87">B_r</tspan>[k]</text></g>
  <g><rect x="498" y="404" width="84" height="64" rx="2" fill="#f7eec6" stroke="#d4a72c"/><text class="rn" x="504" y="417" xml:space="preserve">2 · mem</text><text class="cyc" x="577" y="417" text-anchor="end" xml:space="preserve">128</text><text class="in" x="506" y="439" xml:space="preserve">GR A[k+1]</text><text class="in" x="506" y="456" xml:space="preserve">LR <tspan fill="#3f8f87">B_r</tspan>[k]</text></g>
  <g><rect x="498" y="328" width="84" height="64" rx="2" fill="#cde8d3" stroke="#4c9a5a"/><text class="rn" x="504" y="341" xml:space="preserve">3 · dot</text><text class="cyc" x="577" y="341" text-anchor="end" xml:space="preserve">512</text><text class="in" x="506" y="363" xml:space="preserve">C_tr +=</text><text class="in" x="506" y="380" xml:space="preserve"><tspan fill="#b8556b">A_t</tspan> · <tspan fill="#3f8f87">B_r</tspan></text></g>
  <g><rect x="586" y="404" width="84" height="64" rx="2" fill="#cde8d3" stroke="#4c9a5a"/><text class="rn" x="592" y="417" xml:space="preserve">3 · dot</text><text class="cyc" x="665" y="417" text-anchor="end" xml:space="preserve">512</text><text class="in" x="594" y="439" xml:space="preserve">C_tr +=</text><text class="in" x="594" y="456" xml:space="preserve"><tspan fill="#b8556b">A_t</tspan> · <tspan fill="#3f8f87">B_r</tspan></text></g>
  <g><rect x="586" y="328" width="84" height="64" rx="2" fill="#f7eec6" stroke="#d4a72c"/><text class="rn" x="592" y="341" xml:space="preserve">4 · mem</text><text class="cyc" x="665" y="341" text-anchor="end" xml:space="preserve">384</text><text class="in" x="594" y="363" xml:space="preserve">LR <tspan fill="#4d7cb8">A_b</tspan>[k]</text><text class="in" x="594" y="380" xml:space="preserve">LW B[k+1]</text></g>
  <g><rect x="674" y="404" width="84" height="64" rx="2" fill="#f7eec6" stroke="#d4a72c"/><text class="rn" x="680" y="417" xml:space="preserve">4 · mem</text><text class="cyc" x="753" y="417" text-anchor="end" xml:space="preserve">384</text><text class="in" x="682" y="439" xml:space="preserve">LR <tspan fill="#4d7cb8">A_b</tspan>[k]</text><text class="in" x="682" y="456" xml:space="preserve">LW B[k+1]</text></g>
  <g><rect x="674" y="328" width="84" height="64" rx="2" fill="#cde8d3" stroke="#4c9a5a"/><text class="rn" x="680" y="341" xml:space="preserve">5 · dot</text><text class="cyc" x="753" y="341" text-anchor="end" xml:space="preserve">512</text><text class="in" x="682" y="363" xml:space="preserve">C_bl +=</text><text class="in" x="682" y="380" xml:space="preserve"><tspan fill="#4d7cb8">A_b</tspan> · <tspan fill="#8a5aa8">B_l</tspan></text></g>
  <g><rect x="762" y="404" width="84" height="64" rx="2" fill="#cde8d3" stroke="#4c9a5a"/><text class="rn" x="768" y="417" xml:space="preserve">5 · dot</text><text class="cyc" x="841" y="417" text-anchor="end" xml:space="preserve">512</text><text class="in" x="770" y="439" xml:space="preserve">C_bl +=</text><text class="in" x="770" y="456" xml:space="preserve"><tspan fill="#4d7cb8">A_b</tspan> · <tspan fill="#8a5aa8">B_l</tspan></text></g>
  <g><rect x="762" y="328" width="84" height="64" rx="2" fill="#f7eec6" stroke="#d4a72c"/><text class="rn" x="768" y="341" xml:space="preserve">6 · mem</text><text class="cyc" x="841" y="341" text-anchor="end" xml:space="preserve">256</text><text class="in" x="770" y="363" xml:space="preserve">LR <tspan fill="#8a5aa8">B_l</tspan>[k+1]</text><text class="in" x="770" y="380" xml:space="preserve">LW A[k+1]</text></g>
  <g><rect x="850" y="404" width="84" height="64" rx="2" fill="#f7eec6" stroke="#d4a72c"/><text class="rn" x="856" y="417" xml:space="preserve">6 · mem</text><text class="cyc" x="929" y="417" text-anchor="end" xml:space="preserve">256</text><text class="in" x="858" y="439" xml:space="preserve">LR <tspan fill="#8a5aa8">B_l</tspan>[k+1]</text><text class="in" x="858" y="456" xml:space="preserve">LW A[k+1]</text></g>
  <g><rect x="850" y="328" width="84" height="64" rx="2" fill="#cde8d3" stroke="#4c9a5a"/><text class="rn" x="856" y="341" xml:space="preserve">7 · dot</text><text class="cyc" x="929" y="341" text-anchor="end" xml:space="preserve">512</text><text class="in" x="858" y="363" xml:space="preserve">C_br +=</text><text class="in" x="858" y="380" xml:space="preserve"><tspan fill="#4d7cb8">A_b</tspan> · <tspan fill="#3f8f87">B_r</tspan></text></g>
  <g><rect x="938" y="404" width="84" height="64" rx="2" fill="#cde8d3" stroke="#4c9a5a"/><text class="rn" x="944" y="417" xml:space="preserve">7 · dot</text><text class="cyc" x="1017" y="417" text-anchor="end" xml:space="preserve">512</text><text class="in" x="946" y="439" xml:space="preserve">C_br +=</text><text class="in" x="946" y="456" xml:space="preserve"><tspan fill="#4d7cb8">A_b</tspan> · <tspan fill="#3f8f87">B_r</tspan></text></g>
  <rect x="234" y="404" width="84" height="64" rx="2" fill="url(#hatch)" stroke="#c9c9c9"/><text class="rn" x="276.0" y="440.0" text-anchor="middle" xml:space="preserve">waits</text>
  <g opacity="0.42"><rect x="938" y="328" width="84" height="64" rx="2" fill="#f7eec6" stroke="#d4a72c"/><text class="rn" x="944" y="341" xml:space="preserve">0 · next K-step</text><text class="in" x="946" y="363" xml:space="preserve">GR B[k+2]</text><text class="in" x="946" y="380" xml:space="preserve">LR <tspan fill="#b8556b">A_t</tspan>[k+1]</text></g>
  <text class="note" x="232" y="496" xml:space="preserve">Dashed lines: a barrier at every region boundary (<tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">warp_pipeline_stage</tspan>). In each column one group is on the</text>
  <text class="note" x="232" y="514" xml:space="preserve">matrix unit while the other is in memory. Dot order C_tl → C_tr → C_bl → C_br with read order <tspan fill="#8a5aa8">B_l</tspan> → <tspan fill="#b8556b">A_t</tspan> → <tspan fill="#3f8f87">B_r</tspan> → <tspan fill="#4d7cb8">A_b</tspan>,</text>
  <text class="note" x="232" y="532" xml:space="preserve">so <tspan fill="#b8556b">A_t</tspan> and <tspan fill="#4d7cb8">A_b</tspan> share one register set.</text>
</svg>
