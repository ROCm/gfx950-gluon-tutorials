<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <style>
    .h    { font-size: 12.5px; font-weight: 600; fill: #767676; }
    .p    { font-size: 12px; font-weight: 600; fill: #1a1a1a; }
    .lbl  { font-size: 11.5px; fill: #767676; }
    .seg  { font-size: 10.5px; fill: #1a1a1a; }
    .note { font-size: 11px; fill: #767676; }
    .over { font-size: 11px; fill: #c8443c; }
    .ok   { font-size: 11px; fill: #2f7d43; }
    .win  { fill: none; stroke: #767676; stroke-width: 1.4; }
  </style>

  <text class="h" x="8" y="16">Moving a fraction of the subtract + exp2 from PV to QK. 384 cycles of shadow each.</text>
  <line x1="460" y1="26" x2="460" y2="392" stroke="#767676" stroke-width="1" stroke-dasharray="3 3"/>
  <text class="lbl" x="460" y="24" text-anchor="middle">384</text>

  <!-- f = 0 -->
  <text class="p"   x="8" y="52">move 0</text>
  <text class="lbl" x="112" y="52" text-anchor="end">QK</text>
  <rect x="120" y="38" width="180.5" height="20" fill="#cfe0f7" stroke="#3b7dd8"/><text class="seg" x="210" y="52" text-anchor="middle">204</text>
  <rect class="win" x="120" y="38" width="340" height="20"/>
  <text class="ok" x="540" y="52">180 idle</text>
  <text class="lbl" x="112" y="78" text-anchor="end">PV</text>
  <rect x="120" y="64" width="428.4" height="20" fill="#ded3f5" stroke="#7a5ac9"/><text class="seg" x="334" y="78" text-anchor="middle">484</text>
  <rect class="win" x="120" y="64" width="340" height="20"/>
  <text class="over" x="560" y="78">100 over</text>

  <!-- f = 1/2 -->
  <text class="p"   x="8" y="130">move 1/2</text>
  <text class="lbl" x="112" y="130" text-anchor="end">QK</text>
  <rect x="120"   y="116" width="180.5" height="20" fill="#cfe0f7" stroke="#3b7dd8"/><text class="seg" x="210" y="130" text-anchor="middle">204</text>
  <rect x="300.5" y="116" width="169.9" height="20" fill="#f7d2cf" stroke="#c8443c"/><text class="seg" x="385" y="130" text-anchor="middle">+192</text>
  <rect class="win" x="120" y="116" width="340" height="20"/>
  <text class="over" x="482" y="130">396 — 12 over</text>
  <text class="lbl" x="112" y="156" text-anchor="end">PV</text>
  <rect x="120" y="142" width="258.5" height="20" fill="#ded3f5" stroke="#7a5ac9"/><text class="seg" x="249" y="156" text-anchor="middle">292</text>
  <rect class="win" x="120" y="142" width="340" height="20"/>
  <text class="ok" x="540" y="156">92 idle</text>
  <text class="note" x="120" y="176">Overshoots: QK now spills while PV has slack. The imbalance has simply changed sides.</text>

  <!-- f = 1/4 -->
  <text class="p"   x="8" y="222">move 1/4</text>
  <text class="lbl" x="112" y="222" text-anchor="end">QK</text>
  <rect x="120"   y="208" width="180.5" height="20" fill="#cfe0f7" stroke="#3b7dd8"/><text class="seg" x="210" y="222" text-anchor="middle">204</text>
  <rect x="300.5" y="208" width="85.0"  height="20" fill="#cfe0f7" stroke="#3b7dd8"/><text class="seg" x="343" y="222" text-anchor="middle">+96</text>
  <rect class="win" x="120" y="208" width="340" height="20"/>
  <text class="ok" x="470" y="222">300 — 84 idle</text>
  <text class="lbl" x="112" y="248" text-anchor="end">PV</text>
  <rect x="120" y="234" width="343.4" height="20" fill="#f7d2cf" stroke="#c8443c"/><text class="seg" x="291" y="248" text-anchor="middle">388</text>
  <rect class="win" x="120" y="234" width="340" height="20"/>
  <text class="over" x="480" y="248">4 over</text>
  <text class="note" x="120" y="268">Not enough: PV is still over, and QK is still holding 84 cycles it could have taken.</text>

  <!-- f = 3/8 -->
  <text class="p"   x="8" y="314">move 3/8</text>
  <text class="lbl" x="112" y="314" text-anchor="end">QK</text>
  <rect x="120"   y="300" width="180.5" height="20" fill="#cfe0f7" stroke="#3b7dd8"/><text class="seg" x="210" y="314" text-anchor="middle">204</text>
  <rect x="300.5" y="300" width="127.5" height="20" fill="#cfe0f7" stroke="#3b7dd8"/><text class="seg" x="364" y="314" text-anchor="middle">+144</text>
  <rect class="win" x="120" y="300" width="340" height="20"/>
  <text class="ok" x="470" y="314">348 — fits</text>
  <text class="lbl" x="112" y="340" text-anchor="end">PV</text>
  <rect x="120" y="326" width="301.0" height="20" fill="#ded3f5" stroke="#7a5ac9"/><text class="seg" x="270" y="340" text-anchor="middle">340</text>
  <rect class="win" x="120" y="326" width="340" height="20"/>
  <text class="ok" x="470" y="340">340 — fits</text>
  <text class="note" x="120" y="360">Both inside, within 8 cycles of each other. This is the shipped ratio.</text>

  <g transform="translate(120,384)">
    <rect x="0"   y="0" width="12" height="12" fill="#cfe0f7" stroke="#3b7dd8"/><text class="note" x="18" y="10">QK cluster</text>
    <rect x="105" y="0" width="12" height="12" fill="#ded3f5" stroke="#7a5ac9"/><text class="note" x="123" y="10">PV cluster</text>
    <rect x="210" y="0" width="12" height="12" fill="#f7d2cf" stroke="#c8443c"/><text class="note" x="228" y="10">over 384 — the excess issues in the open</text>
  </g>
  <text class="note" x="120" y="422">Endpoint measured from the compiled kernel; the ratios in between move f x 384 cycles across.</text>
</svg>
