<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <style>
    .h { font-size: 12.5px; font-weight: 600; fill: #767676; }
    .p { font-size: 12px; font-weight: 600; fill: #1a1a1a; }
    .lbl { font-size: 11.5px; fill: #767676; }
    .seg { font-size: 9px; fill: #1a1a1a; }
    .note { font-size: 11px; fill: #767676; }
    .over { font-size: 11px; fill: #c8443c; }
    .ok { font-size: 11px; fill: #2f7d43; }
    .win { fill: none; stroke: #767676; stroke-width: 1.4; }
  </style>
  <text class="h" x="8" y="16">Moving a fraction of the subtract + exp2 from PV to QK. 384 cycles of shadow each.</text>
  <line x1="460" y1="26" x2="460" y2="384" stroke="#767676" stroke-width="1" stroke-dasharray="3 3"/>
  <text class="lbl" x="460" y="24" text-anchor="middle">384</text>
  <text class="p" x="8" y="52">move 0</text>
  <text class="lbl" x="112" y="52" text-anchor="end">QK</text>
  <rect x="120.0" y="38" width="56.7" height="20" fill="#cfe0f7" stroke="#3b7dd8"/><text class="seg" x="148.3" y="52" text-anchor="middle">cvt 64</text>
  <rect x="176.7" y="38" width="113.3" height="20" fill="#cfe0f7" stroke="#3b7dd8"/><text class="seg" x="233.3" y="52" text-anchor="middle">sum 128</text>
  <rect class="win" x="120" y="38" width="340" height="20"/>
  <text class="ok" x="472.0" y="52">204 — fits</text>
  <text class="lbl" x="112" y="78" text-anchor="end">PV</text>
  <rect x="120.0" y="64" width="56.7" height="20" fill="#f7d2cf" stroke="#c8443c"/><text class="seg" x="148.3" y="78" text-anchor="middle">max 64</text>
  <rect x="176.7" y="64" width="113.3" height="20" fill="#f7d2cf" stroke="#c8443c"/><text class="seg" x="233.3" y="78" text-anchor="middle">fma 128</text>
  <rect x="290.0" y="64" width="226.7" height="20" fill="#f7d2cf" stroke="#c8443c"/><text class="seg" x="403.3" y="78" text-anchor="middle">exp 256</text>
  <rect class="win" x="120" y="64" width="340" height="20"/>
  <text class="over" x="560.5" y="78">484 — 100 over</text>
  <text class="note" x="120" y="104">PV over by 100, QK holding 180 idle.</text>
  <text class="p" x="8" y="144">move 1/2</text>
  <text class="lbl" x="112" y="144" text-anchor="end">QK</text>
  <rect x="120.0" y="130" width="56.7" height="20" fill="#cfe0f7" stroke="#3b7dd8"/><text class="seg" x="148.3" y="144" text-anchor="middle">cvt 64</text>
  <rect x="176.7" y="130" width="113.3" height="20" fill="#cfe0f7" stroke="#3b7dd8"/><text class="seg" x="233.3" y="144" text-anchor="middle">sum 128</text>
  <rect x="300.6" y="130" width="56.7" height="20" fill="#f7d2cf" stroke="#c8443c"/><text class="seg" x="329.0" y="144" text-anchor="middle">fma 64</text>
  <rect x="357.3" y="130" width="113.3" height="20" fill="#f7d2cf" stroke="#c8443c"/><text class="seg" x="414.0" y="144" text-anchor="middle">exp 128</text>
  <rect class="win" x="120" y="130" width="340" height="20"/>
  <text class="over" x="482.6" y="144">396 — 12 over</text>
  <text class="lbl" x="112" y="170" text-anchor="end">PV</text>
  <rect x="120.0" y="156" width="56.7" height="20" fill="#cfe0f7" stroke="#3b7dd8"/><text class="seg" x="148.3" y="170" text-anchor="middle">max 64</text>
  <rect x="176.7" y="156" width="56.7" height="20" fill="#cfe0f7" stroke="#3b7dd8"/><text class="seg" x="205.0" y="170" text-anchor="middle">fma 64</text>
  <rect x="233.3" y="156" width="113.3" height="20" fill="#ded3f5" stroke="#7a5ac9"/><text class="seg" x="290.0" y="170" text-anchor="middle">exp 128</text>
  <rect class="win" x="120" y="156" width="340" height="20"/>
  <text class="ok" x="472.0" y="170">292 — fits</text>
  <text class="note" x="120" y="196">Overshoots: QK spills, PV now has slack. Imbalance, other side.</text>
  <text class="p" x="8" y="236">move 1/4</text>
  <text class="lbl" x="112" y="236" text-anchor="end">QK</text>
  <rect x="120.0" y="222" width="56.7" height="20" fill="#cfe0f7" stroke="#3b7dd8"/><text class="seg" x="148.3" y="236" text-anchor="middle">cvt 64</text>
  <rect x="176.7" y="222" width="113.3" height="20" fill="#cfe0f7" stroke="#3b7dd8"/><text class="seg" x="233.3" y="236" text-anchor="middle">sum 128</text>
  <rect x="300.6" y="222" width="28.3" height="20" fill="#cfe0f7" stroke="#3b7dd8"/><text class="seg" x="314.8" y="236" text-anchor="middle">fma 32</text>
  <rect x="329.0" y="222" width="56.7" height="20" fill="#ded3f5" stroke="#7a5ac9"/><text class="seg" x="357.3" y="236" text-anchor="middle">exp 64</text>
  <rect class="win" x="120" y="222" width="340" height="20"/>
  <text class="ok" x="472.0" y="236">300 — fits</text>
  <text class="lbl" x="112" y="262" text-anchor="end">PV</text>
  <rect x="120.0" y="248" width="56.7" height="20" fill="#f7d2cf" stroke="#c8443c"/><text class="seg" x="148.3" y="262" text-anchor="middle">max 64</text>
  <rect x="176.7" y="248" width="85.0" height="20" fill="#f7d2cf" stroke="#c8443c"/><text class="seg" x="219.2" y="262" text-anchor="middle">fma 96</text>
  <rect x="261.7" y="248" width="170.0" height="20" fill="#f7d2cf" stroke="#c8443c"/><text class="seg" x="346.7" y="262" text-anchor="middle">exp 192</text>
  <rect class="win" x="120" y="248" width="340" height="20"/>
  <text class="over" x="475.5" y="262">388 — 4 over</text>
  <text class="note" x="120" y="288">Not enough: PV still over, QK still holding 84 it could take.</text>
  <text class="p" x="8" y="328">move 3/8</text>
  <text class="lbl" x="112" y="328" text-anchor="end">QK</text>
  <rect x="120.0" y="314" width="56.7" height="20" fill="#cfe0f7" stroke="#3b7dd8"/><text class="seg" x="148.3" y="328" text-anchor="middle">cvt 64</text>
  <rect x="176.7" y="314" width="113.3" height="20" fill="#cfe0f7" stroke="#3b7dd8"/><text class="seg" x="233.3" y="328" text-anchor="middle">sum 128</text>
  <rect x="300.6" y="314" width="42.5" height="20" fill="#cfe0f7" stroke="#3b7dd8"/><text class="seg" x="321.9" y="328" text-anchor="middle">fma 48</text>
  <rect x="343.1" y="314" width="85.0" height="20" fill="#ded3f5" stroke="#7a5ac9"/><text class="seg" x="385.6" y="328" text-anchor="middle">exp 96</text>
  <rect class="win" x="120" y="314" width="340" height="20"/>
  <text class="ok" x="472.0" y="328">348 — fits</text>
  <text class="lbl" x="112" y="354" text-anchor="end">PV</text>
  <rect x="120.0" y="340" width="56.7" height="20" fill="#cfe0f7" stroke="#3b7dd8"/><text class="seg" x="148.3" y="354" text-anchor="middle">max 64</text>
  <rect x="176.7" y="340" width="70.8" height="20" fill="#cfe0f7" stroke="#3b7dd8"/><text class="seg" x="212.1" y="354" text-anchor="middle">fma 80</text>
  <rect x="247.5" y="340" width="141.7" height="20" fill="#ded3f5" stroke="#7a5ac9"/><text class="seg" x="318.3" y="354" text-anchor="middle">exp 160</text>
  <rect class="win" x="120" y="340" width="340" height="20"/>
  <text class="ok" x="472.0" y="354">340 — fits</text>
  <text class="note" x="120" y="380">Both inside, within 8 cycles of each other. The shipped ratio.</text>
  <text class="note" x="120" y="410">Bars are softmax only; each total adds 12 (QK) / 36 (PV) cycles of backend address arithmetic.</text>
</svg>
