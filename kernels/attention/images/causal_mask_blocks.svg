  <text class="lbl" x="392" y="248">The state follows from k0 = 32 &#183; wave &#8722; delta, one</text>
  <text class="lbl" x="392" y="264">wave-uniform scalar, so in plain code a scalar branch</text>
  <text class="lbl" x="392" y="280">skips whole blocks. In the warp-pipelined masked loop</text>
  <text class="lbl" x="392" y="296">the mask is branch-free: every register is compared.</text>
  <text class="note" x="8" y="362">Rows: the 8 waves of the 256-row q-block, 32 rows each. Columns: its last four K/V tiles, 2 blocks of 32 keys each.</text>
