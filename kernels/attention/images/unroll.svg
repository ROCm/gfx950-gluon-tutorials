<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 170" width="760" height="170" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <style>
    .h    { font-size: 12.5px; font-weight: 600; fill: #767676; }
    .lbl  { font-size: 12px; fill: #767676; }
    .in   { font-size: 11px; fill: #1a1a1a; }
    .note { font-size: 11.5px; fill: #767676; }
    .bad  { font-size: 11.5px; fill: #c8443c; }
    .good { font-size: 11.5px; fill: #2f7d43; }
  </style>

  <text class="h" x="8" y="16">The two score buffers swap every tile, so a 1x loop would need a copy to put them back</text>

  <text class="lbl" x="8" y="52">1x</text>
  <rect x="40"  y="36" width="104" height="24" fill="#cfe0f7" stroke="#3b7dd8"/><text class="in" x="92"  y="52" text-anchor="middle">VEC2 -&gt; buf0</text>
  <rect x="152" y="36" width="104" height="24" fill="#cfe0f7" stroke="#3b7dd8"/><text class="in" x="204" y="52" text-anchor="middle">VEC1 -&gt; buf2</text>
  <text class="bad" x="268" y="52">next tile wants VEC2 in buf0 — copy 32 VGPRs, every tile</text>

  <text class="lbl" x="8" y="98">2x</text>
  <rect x="40"  y="82" width="104" height="24" fill="#cfe0f7" stroke="#3b7dd8"/><text class="in" x="92"  y="98" text-anchor="middle">VEC2 -&gt; buf0</text>
  <rect x="152" y="82" width="104" height="24" fill="#cfe0f7" stroke="#3b7dd8"/><text class="in" x="204" y="98" text-anchor="middle">VEC1 -&gt; buf2</text>
  <rect x="264" y="82" width="104" height="24" fill="#cfe0f7" stroke="#3b7dd8"/><text class="in" x="316" y="98" text-anchor="middle">VEC2 -&gt; buf2</text>
  <rect x="376" y="82" width="104" height="24" fill="#cfe0f7" stroke="#3b7dd8"/><text class="in" x="428" y="98" text-anchor="middle">VEC1 -&gt; buf0</text>
  <text class="good" x="492" y="98">back where it started — no copy</text>

  <text class="note" x="40" y="140">Unrolling also turns the double-buffer slot indices into compile-time constants</text>
  <text class="note" x="40" y="158">instead of runtime modulo arithmetic on every LDS address.</text>
</svg>
