<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 244" width="760" height="244" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <style>
    .h    { font-size: 12.5px; font-weight: 600; fill: #767676; }
    .st   { font-size: 11.5px; font-weight: 600; fill: #767676; }
    .lbl  { font-size: 11px; fill: #767676; }
    .sm   { font-size: 9.5px; fill: #767676; }
    .in   { font-size: 10px; fill: #1a1a1a; }
    .ins  { font-size: 9px; fill: #1a1a1a; }
    .inb  { font-size: 10px; font-weight: 600; fill: #1a1a1a; }
    .note { font-size: 11px; fill: #767676; }
    .bad  { font-size: 11px; fill: #c8443c; }
    .ok   { font-size: 11px; fill: #2f7d43; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>

  <text class="h" x="8" y="16">LDS placement: largest buffer first, so O's staging buffer decides where the K/V ring lands</text>
  <text class="st" x="8" y="44">1</text>
  <text class="lbl" x="22" y="44">O through one 64 KB layout-conversion scratch</text>
  <rect x="24" y="54" width="198.4" height="30" fill="#e6e6e6" stroke="#909090"/>
  <text class="in" x="123.2" y="67.5" text-anchor="middle">O conversion scratch</text>
  <text class="ins" x="123.2" y="79" text-anchor="middle">64 KB</text>
  <rect x="222.4" y="54" width="105.21" height="30" fill="#f7eec6" stroke="#d4a72c"/>
  <text class="in" x="275" y="67.5" text-anchor="middle">V ring</text>
  <text class="ins" x="275" y="79" text-anchor="middle">33.9 KB</text>
  <rect x="327.61" y="54" width="100.75" height="30" fill="#f7eec6" stroke="#d4a72c"/>
  <text class="in" x="377.98" y="67.5" text-anchor="middle">K ring</text>
  <text class="ins" x="377.98" y="79" text-anchor="middle">32.5 KB</text>
  <rect x="24" y="54" width="496" height="30" fill="none" stroke="#b9b9b9" stroke-dasharray="2 3"/>
  <text class="st" x="8" y="124">2</text>
  <text class="lbl" x="22" y="124">fmha_v5: O through two explicit 32 KB halves, each smaller than a ring buffer</text>
  <rect x="24" y="134" width="105.21" height="30" fill="#f7eec6" stroke="#d4a72c"/>
  <text class="in" x="76.6" y="147.5" text-anchor="middle">V ring</text>
  <text class="ins" x="76.6" y="159" text-anchor="middle">33.9 KB</text>
  <rect x="129.21" y="134" width="100.75" height="30" fill="#f7eec6" stroke="#d4a72c"/>
  <text class="in" x="179.58" y="147.5" text-anchor="middle">K ring</text>
  <text class="ins" x="179.58" y="159" text-anchor="middle">32.5 KB</text>
  <rect x="229.96" y="134" width="99.2" height="30" fill="#cde8d3" stroke="#4c9a5a"/>
  <text class="in" x="279.56" y="147.5" text-anchor="middle">O, d 0&#8211;63</text>
  <text class="ins" x="279.56" y="159" text-anchor="middle">32 KB</text>
  <rect x="329.16" y="134" width="99.2" height="30" fill="#cde8d3" stroke="#4c9a5a"/>
  <text class="in" x="378.76" y="147.5" text-anchor="middle">O, d 64&#8211;127</text>
  <text class="ins" x="378.76" y="159" text-anchor="middle">32 KB</text>
  <rect x="24" y="134" width="496" height="30" fill="none" stroke="#b9b9b9" stroke-dasharray="2 3"/>
  <line x1="222.4" y1="50" x2="222.4" y2="90" stroke="#c8443c" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="222.4" y1="130" x2="222.4" y2="172" stroke="#c8443c" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text class="bad" x="222.4" y="186" text-anchor="middle">64 KB</text>
  <text class="sm" x="520" y="186" text-anchor="middle">160 KB</text>
  <text class="sm" x="24" y="186" text-anchor="middle">0</text>
  <text class="bad" x="532" y="66">the ring sits above 64 KB: its</text>
  <text class="bad" x="532" y="80">offsets no longer fit ds_read's</text>
  <text class="bad" x="532" y="94">16-bit immediate</text>
  <text class="ok" x="532" y="146">every ring slot starts below</text>
  <text class="ok" x="532" y="160">64 KB (largest ds_read</text>
  <text class="ok" x="532" y="174">immediate: 52128)</text>
  <text class="note" x="8" y="212">The ring stays live through the epilogue (the next q-block's tiles are already in it), so O's buffer cannot reuse it. Storing O</text>
  <text class="note" x="8" y="228">straight from the MFMA layout avoids LDS altogether, but every 8-byte store then spans 32 rows: +4 &#181;s per q-block.</text>
</svg>
