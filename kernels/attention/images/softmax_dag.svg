<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="760" height="270" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <style>
    .h    { font-size: 12.5px; font-weight: 600; fill: #767676; }
    .grp  { font-size: 12px; font-weight: 600; fill: #767676; }
    .in   { font-size: 11px; fill: #1a1a1a; }
    .cnt  { font-size: 10px; fill: #767676; }
    .note { font-size: 11.5px; fill: #767676; }
    .e    { stroke: #909090; stroke-width: 1.3; fill: none; marker-end: url(#a); }
    .cut  { stroke: #c8443c; stroke-width: 1.6; stroke-dasharray: 5 4; }
    .cl   { font-size: 11px; fill: #c8443c; }
    .reg  { fill: none; stroke: #b9b9b9; stroke-dasharray: 3 3; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#909090"/>
    </marker>
  </defs>

  <text class="h" x="8" y="16">The softmax is one dependency chain. The split has to cut it somewhere.</text>

  <rect class="reg" x="20"  y="36" width="400" height="60"/>
  <text class="grp" x="28" y="32">VEC1 — PV cluster</text>
  <rect class="reg" x="470" y="36" width="150" height="176"/>
  <text class="grp" x="478" y="32">VEC2 — QK cluster</text>

  <!-- VEC1: all three on one row -->
  <rect x="32"  y="48" width="104" height="34" fill="#cfe0f7" stroke="#3b7dd8"/>
  <text class="in"  x="84" y="64" text-anchor="middle">row max</text>
  <text class="cnt" x="84" y="76" text-anchor="middle">16 x max3</text>

  <rect x="168" y="48" width="104" height="34" fill="#cfe0f7" stroke="#3b7dd8"/>
  <text class="in"  x="220" y="64" text-anchor="middle">subtract</text>
  <text class="cnt" x="220" y="76" text-anchor="middle">32 x fma</text>

  <rect x="304" y="48" width="104" height="34" fill="#ded3f5" stroke="#7a5ac9"/>
  <text class="in"  x="356" y="64" text-anchor="middle">exp2</text>
  <text class="cnt" x="356" y="76" text-anchor="middle">32 x exp</text>

  <!-- VEC2: all three in one column -->
  <rect x="482" y="48" width="126" height="34" fill="#cfe0f7" stroke="#3b7dd8"/>
  <text class="in"  x="545" y="64" text-anchor="middle">row sum</text>
  <text class="cnt" x="545" y="76" text-anchor="middle">32 x add</text>

  <rect x="482" y="106" width="126" height="34" fill="#cfe0f7" stroke="#3b7dd8"/>
  <text class="in"  x="545" y="122" text-anchor="middle">downcast</text>
  <text class="cnt" x="545" y="134" text-anchor="middle">16 x cvt_pk</text>

  <rect x="482" y="164" width="126" height="34" fill="#cfe0f7" stroke="#3b7dd8"/>
  <text class="in"  x="545" y="180" text-anchor="middle">rescale acc</text>
  <text class="cnt" x="545" y="192" text-anchor="middle">64 x mul</text>

  <path class="e" d="M 136,65 L 164,65"/>
  <path class="e" d="M 272,65 L 300,65"/>
  <path class="e" d="M 408,65 L 478,65"/>
  <path class="e" d="M 408,72 C 440,72 448,123 478,123"/>
  <path class="e" d="M 84,82  C 84,230 300,236 478,190"/>

  <line class="cut" x1="445" y1="36" x2="445" y2="212"/>
  <text class="cl" x="445" y="226" text-anchor="middle">the cut</text>

  <text class="note" x="8" y="248">The row max is a reduction — nothing downstream exists until the whole tile is reduced, so it cannot move,</text>
  <text class="note" x="8" y="264">and the subtract needs it. Both consumers of exp2 sit past the cut, so the chain admits one clean cut point.</text>
</svg>
