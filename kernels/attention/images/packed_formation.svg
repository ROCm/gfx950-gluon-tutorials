<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <style>
    .h    { font-size: 12.5px; font-weight: 600; fill: #767676; }
    .st   { font-size: 12px; font-weight: 600; fill: #1a1a1a; }
    .in   { font-size: 9.5px; fill: #1a1a1a; }
    .note { font-size: 11px; fill: #767676; }
    .bad  { font-size: 11px; fill: #c8443c; }
    .ok   { font-size: 11px; fill: #2f7d43; }
    .win  { fill: none; stroke: #767676; stroke-width: 1; stroke-dasharray: 3 3; }
    .gap  { fill: #f7d2cf; stroke: #c8443c; stroke-dasharray: 3 2; }
  </style>

  <text class="h" x="8" y="16">A declared group of packed ops, and what it becomes. One shadow = 24 cycles = 6 slots.</text>

  <!-- ============ 1. declared ============ -->
  <text class="st"   x="8" y="52">1</text>
  <text class="note" x="22" y="52">declared: 3 packed per shadow — plus the ones the budget could not cover</text>
  <g transform="translate(22,60)">
    <rect x="0"   y="0" width="58" height="22" fill="#cde8d3" stroke="#4c9a5a"/><text class="in" x="29"  y="15" text-anchor="middle">MFMA</text>
    <rect x="60"  y="0" width="42" height="22" fill="#f7d2cf" stroke="#c8443c"/><text class="in" x="81"  y="15" text-anchor="middle">pk</text>
    <rect x="104" y="0" width="42" height="22" fill="#f7d2cf" stroke="#c8443c"/><text class="in" x="125" y="15" text-anchor="middle">pk</text>
    <rect x="148" y="0" width="42" height="22" fill="#f7d2cf" stroke="#c8443c"/><text class="in" x="169" y="15" text-anchor="middle">pk</text>
    <rect class="win" x="60" y="0" width="130" height="22"/>
    <rect x="192" y="0" width="58" height="22" fill="#cde8d3" stroke="#4c9a5a"/><text class="in" x="221" y="15" text-anchor="middle">MFMA</text>
    <rect x="252" y="0" width="42" height="22" fill="#f7d2cf" stroke="#c8443c"/><text class="in" x="273" y="15" text-anchor="middle">pk</text>
    <rect x="296" y="0" width="42" height="22" fill="#f7d2cf" stroke="#c8443c"/><text class="in" x="317" y="15" text-anchor="middle">pk</text>
    <rect x="340" y="0" width="42" height="22" fill="#f7d2cf" stroke="#c8443c"/><text class="in" x="361" y="15" text-anchor="middle">pk</text>
    <rect class="win" x="252" y="0" width="130" height="22"/>
    <rect x="392" y="0" width="42" height="22" fill="#f7d2cf" stroke="#c8443c"/><text class="in" x="413" y="15" text-anchor="middle">pk</text>
    <rect x="436" y="0" width="42" height="22" fill="#f7d2cf" stroke="#c8443c"/><text class="in" x="457" y="15" text-anchor="middle">pk</text>
    <text class="note" x="488" y="15">uncovered — stay packed</text>
  </g>

  <!-- ============ 2. after the peephole ============ -->
  <text class="st"   x="8" y="132">2</text>
  <text class="note" x="22" y="132">SIPreEmitPeephole splits only what sits in a shadow: 3 packed become 6 scalars</text>
  <g transform="translate(22,140)">
    <rect x="0"   y="0" width="58" height="22" fill="#cde8d3" stroke="#4c9a5a"/><text class="in" x="29"  y="15" text-anchor="middle">MFMA</text>
    <rect x="60"  y="0" width="20" height="22" fill="#cfe0f7" stroke="#3b7dd8"/>
    <rect x="82"  y="0" width="20" height="22" fill="#cfe0f7" stroke="#3b7dd8"/>
    <rect x="104" y="0" width="20" height="22" fill="#cfe0f7" stroke="#3b7dd8"/>
    <rect x="126" y="0" width="20" height="22" fill="#cfe0f7" stroke="#3b7dd8"/>
    <rect x="148" y="0" width="20" height="22" fill="#cfe0f7" stroke="#3b7dd8"/>
    <rect x="170" y="0" width="20" height="22" fill="#cfe0f7" stroke="#3b7dd8"/>
    <rect class="win" x="60" y="0" width="130" height="22"/>
    <rect x="192" y="0" width="58" height="22" fill="#cde8d3" stroke="#4c9a5a"/><text class="in" x="221" y="15" text-anchor="middle">MFMA</text>
    <rect x="252" y="0" width="20" height="22" fill="#cfe0f7" stroke="#3b7dd8"/>
    <rect x="274" y="0" width="20" height="22" fill="#cfe0f7" stroke="#3b7dd8"/>
    <rect x="296" y="0" width="20" height="22" fill="#cfe0f7" stroke="#3b7dd8"/>
    <rect x="318" y="0" width="20" height="22" fill="#cfe0f7" stroke="#3b7dd8"/>
    <rect x="340" y="0" width="20" height="22" fill="#cfe0f7" stroke="#3b7dd8"/>
    <rect x="362" y="0" width="20" height="22" fill="#cfe0f7" stroke="#3b7dd8"/>
    <rect class="win" x="252" y="0" width="130" height="22"/>
    <rect class="gap" x="384" y="0" width="46" height="22"/><text class="in" x="407" y="15" text-anchor="middle">gap</text>
    <rect x="432" y="0" width="42" height="22" fill="#f7d2cf" stroke="#c8443c"/><text class="in" x="453" y="15" text-anchor="middle">pk</text>
    <rect x="476" y="0" width="42" height="22" fill="#f7d2cf" stroke="#c8443c"/><text class="in" x="497" y="15" text-anchor="middle">pk</text>
  </g>
  <text class="bad"  x="22" y="192">The shadows are exactly full — but a packed op cannot follow an MFMA back to back, so the</text>
  <text class="bad"  x="22" y="208">first `pk` waits. The uncovered work is not just exposed, it is exposed plus a hazard.</text>

  <!-- ============ 3. reordered ============ -->
  <text class="st"   x="8" y="248">3</text>
  <text class="note" x="22" y="248">put the uncovered packed ops first, and the hazard has nothing to stall behind</text>
  <g transform="translate(22,256)">
    <rect x="0"   y="0" width="42" height="22" fill="#f7d2cf" stroke="#c8443c"/><text class="in" x="21"  y="15" text-anchor="middle">pk</text>
    <rect x="44"  y="0" width="42" height="22" fill="#f7d2cf" stroke="#c8443c"/><text class="in" x="65"  y="15" text-anchor="middle">pk</text>
    <rect x="96"  y="0" width="58" height="22" fill="#cde8d3" stroke="#4c9a5a"/><text class="in" x="125" y="15" text-anchor="middle">MFMA</text>
    <rect x="156" y="0" width="20" height="22" fill="#cfe0f7" stroke="#3b7dd8"/>
    <rect x="178" y="0" width="20" height="22" fill="#cfe0f7" stroke="#3b7dd8"/>
    <rect x="200" y="0" width="20" height="22" fill="#cfe0f7" stroke="#3b7dd8"/>
    <rect x="222" y="0" width="20" height="22" fill="#cfe0f7" stroke="#3b7dd8"/>
    <rect x="244" y="0" width="20" height="22" fill="#cfe0f7" stroke="#3b7dd8"/>
    <rect x="266" y="0" width="20" height="22" fill="#cfe0f7" stroke="#3b7dd8"/>
    <rect class="win" x="156" y="0" width="130" height="22"/>
    <rect x="288" y="0" width="58" height="22" fill="#cde8d3" stroke="#4c9a5a"/><text class="in" x="317" y="15" text-anchor="middle">MFMA</text>
    <rect x="348" y="0" width="20" height="22" fill="#cfe0f7" stroke="#3b7dd8"/>
    <rect x="370" y="0" width="20" height="22" fill="#cfe0f7" stroke="#3b7dd8"/>
    <rect x="392" y="0" width="20" height="22" fill="#cfe0f7" stroke="#3b7dd8"/>
    <rect x="414" y="0" width="20" height="22" fill="#cfe0f7" stroke="#3b7dd8"/>
    <rect x="436" y="0" width="20" height="22" fill="#cfe0f7" stroke="#3b7dd8"/>
    <rect x="458" y="0" width="20" height="22" fill="#cfe0f7" stroke="#3b7dd8"/>
    <rect class="win" x="348" y="0" width="130" height="22"/>
    <text class="ok" x="488" y="15">no gap</text>
  </g>
  <text class="note" x="22" y="306">Same instructions, same count — only the order differs, and it is chosen in the kernel, not by the compiler.</text>
</svg>
