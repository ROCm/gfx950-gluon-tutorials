<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 306" width="760" height="306" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <style>
    .h    { font-size: 12.5px; font-weight: 600; fill: #767676; }
    .st   { font-size: 11.5px; font-weight: 600; fill: #767676; }
    .lbl  { font-size: 11px; fill: #767676; }
    .sm   { font-size: 9.5px; fill: #767676; }
    .in   { font-size: 10px; fill: #1a1a1a; }
    .ins  { font-size: 9px; fill: #1a1a1a; }
    .inb  { font-size: 10px; font-weight: 600; fill: #1a1a1a; }
    .note { font-size: 11px; fill: #767676; }
    .bad  { font-size: 11px; fill: #c8443c; }
    .ok   { font-size: 11px; fill: #2f7d43; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#909090"/>
    </marker>
  </defs>

  <text class="h" x="8" y="16">The hand-over between q-blocks: load the next block while this one finishes</text>
  <text class="st" x="8" y="44">1</text>
  <text class="lbl" x="22" y="44">loads issued after the epilogue: the next block's prologue waits for them</text>
  <text class="lbl" x="102" y="77" text-anchor="end">MFMA / VALU</text>
  <text class="lbl" x="102" y="112" text-anchor="end">loads</text>
  <rect x="112" y="58" width="72" height="30" fill="#cfe0f7" stroke="#3b7dd8"/>
  <text class="in" x="148" y="71.5" text-anchor="middle">masked loop</text>
  <text class="ins" x="148" y="83" text-anchor="middle">q-block j</text>
  <rect x="186" y="58" width="92" height="30" fill="#f7e0c6" stroke="#d9822b"/>
  <text class="in" x="232" y="71.5" text-anchor="middle">drain</text>
  <text class="ins" x="232" y="83" text-anchor="middle">QK n&#8722;1, PV n&#8722;2</text>
  <rect x="280" y="58" width="50" height="30" fill="#f7e0c6" stroke="#d9822b"/>
  <text class="in" x="305" y="76.5" text-anchor="middle">PV n&#8722;1</text>
  <rect x="332" y="58" width="100" height="30" fill="#e6e6e6" stroke="#909090"/>
  <text class="in" x="382" y="71.5" text-anchor="middle">epilogue</text>
  <text class="ins" x="382" y="83" text-anchor="middle">O / l, store O, LSE</text>
  <rect x="434" y="58" width="84" height="30" fill="#ececec" stroke="#b9b9b9" stroke-dasharray="3 3"/>
  <text class="ins" x="476" y="77" text-anchor="middle">waiting</text>
  <rect x="520" y="58" width="70" height="30" fill="#cfe0f7" stroke="#3b7dd8"/>
  <text class="in" x="555" y="71.5" text-anchor="middle">prologue</text>
  <text class="ins" x="555" y="83" text-anchor="middle">of j+1</text>
  <rect x="592" y="58" width="76" height="30" fill="#cfe0f7" stroke="#3b7dd8"/>
  <text class="in" x="630" y="71.5" text-anchor="middle">plain loop</text>
  <text class="ins" x="630" y="83" text-anchor="middle">of j+1</text>
  <rect x="112" y="96" width="100" height="26" fill="#f7eec6" stroke="#d4a72c"/>
  <text class="ins" x="162" y="112.5" text-anchor="middle">K/V of j</text>
  <rect x="436" y="96" width="56" height="26" fill="#f7eec6" stroke="#d4a72c"/>
  <text class="ins" x="464" y="112.5" text-anchor="middle">Q &#8594; regs</text>
  <rect x="494" y="96" width="96" height="26" fill="#f7eec6" stroke="#d4a72c"/>
  <text class="ins" x="542" y="112.5" text-anchor="middle">K0 V0 K1 &#8594; ring</text>
  <text class="st" x="8" y="156">2</text>
  <text class="lbl" x="22" y="156">fmha_v5: the next block's Q and first three K/V tiles load under the last PV and the epilogue</text>
  <text class="lbl" x="102" y="189" text-anchor="end">MFMA / VALU</text>
  <text class="lbl" x="102" y="224" text-anchor="end">loads</text>
  <rect x="112" y="170" width="72" height="30" fill="#cfe0f7" stroke="#3b7dd8"/>
  <text class="in" x="148" y="183.5" text-anchor="middle">masked loop</text>
  <text class="ins" x="148" y="195" text-anchor="middle">q-block j</text>
  <rect x="186" y="170" width="92" height="30" fill="#f7e0c6" stroke="#d9822b"/>
  <text class="in" x="232" y="183.5" text-anchor="middle">drain</text>
  <text class="ins" x="232" y="195" text-anchor="middle">QK n&#8722;1, PV n&#8722;2</text>
  <rect x="280" y="170" width="50" height="30" fill="#f7e0c6" stroke="#d9822b"/>
  <text class="in" x="305" y="188.5" text-anchor="middle">PV n&#8722;1</text>
  <rect x="332" y="170" width="100" height="30" fill="#e6e6e6" stroke="#909090"/>
  <text class="in" x="382" y="183.5" text-anchor="middle">epilogue</text>
  <text class="ins" x="382" y="195" text-anchor="middle">O / l, store O, LSE</text>
  <rect x="434" y="170" width="70" height="30" fill="#cfe0f7" stroke="#3b7dd8"/>
  <text class="in" x="469" y="183.5" text-anchor="middle">prologue</text>
  <text class="ins" x="469" y="195" text-anchor="middle">of j+1</text>
  <rect x="506" y="170" width="76" height="30" fill="#cfe0f7" stroke="#3b7dd8"/>
  <text class="in" x="544" y="183.5" text-anchor="middle">plain loop</text>
  <text class="ins" x="544" y="195" text-anchor="middle">of j+1</text>
  <rect x="112" y="208" width="100" height="26" fill="#f7eec6" stroke="#d4a72c"/>
  <text class="ins" x="162" y="224.5" text-anchor="middle">K/V of j</text>
  <rect x="250" y="208" width="56" height="26" fill="#f7eec6" stroke="#d4a72c"/>
  <text class="ins" x="278" y="224.5" text-anchor="middle">Q &#8594; regs</text>
  <rect x="308" y="208" width="96" height="26" fill="#f7eec6" stroke="#d4a72c"/>
  <text class="ins" x="356" y="224.5" text-anchor="middle">K0 V0 K1 &#8594; ring</text>
  <line x1="246" y1="166" x2="246" y2="238" stroke="#7a5ac9" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text class="lbl" x="250" y="250">after the last K/V read: wait_group(0) + barrier</text>
  <rect x="584" y="170" width="84" height="30" fill="none" stroke="#4c9a5a" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text class="ok" x="626" y="189" text-anchor="middle">saved</text>
  <text class="note" x="8" y="280">Q goes straight into the MFMA operand registers (this block's Q is dead after its last QK); K0, V0, K1 go into the</text>
  <text class="note" x="8" y="296">ring slots this block has finished reading. What remains is ~3 &#181;s per q-block, paid 32 times per CU in causal.</text>
</svg>
