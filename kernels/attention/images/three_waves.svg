<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <style>
    .h    { font-size: 12.5px; font-weight: 600; fill: #767676; }
    .lbl  { font-size: 11.5px; fill: #767676; }
    .wg   { font-size: 10.5px; fill: #767676; }
    .in   { font-size: 11px; fill: #1a1a1a; }
    .note { font-size: 11.5px; fill: #767676; }
    .bad  { font-size: 11.5px; fill: #c8443c; }
    .col  { stroke: #c8c8c8; stroke-width: 1; stroke-dasharray: 2 3; }
    .box  { fill: none; stroke: #c8443c; stroke-width: 1.4; stroke-dasharray: 4 3; }
  </style>

  <text class="h" x="8" y="16">B. a stage of its own — needs three waves live at once, so three workgroups on the CU</text>

  <line class="col" x1="266" y1="30" x2="266" y2="150"/>
  <line class="col" x1="342" y1="30" x2="342" y2="150"/>
  <line class="col" x1="418" y1="30" x2="418" y2="150"/>
  <line class="col" x1="494" y1="30" x2="494" y2="150"/>

  <text class="lbl" x="8" y="52">wave 0</text><text class="wg" x="8" y="65">wgroup A</text>
  <rect x="120" y="38" width="112" height="22" fill="#cde8d3" stroke="#4c9a5a"/><text class="in" x="176" y="54" text-anchor="middle">MFMA</text>
  <rect x="240" y="38" width="56"  height="22" fill="#cfe0f7" stroke="#3b7dd8"/><text class="in" x="268" y="54" text-anchor="middle">valu</text>
  <rect x="316" y="38" width="56"  height="22" fill="#cfe0f7" stroke="#3b7dd8"/><text class="in" x="344" y="54" text-anchor="middle">valu</text>

  <text class="lbl" x="8" y="96">wave 1</text><text class="wg" x="8" y="109">wgroup B</text>
  <rect x="240" y="82" width="56" height="22" fill="#f7eec6" stroke="#d4a72c"/><text class="in" x="268" y="98" text-anchor="middle">ds</text>
  <rect x="316" y="82" width="56" height="22" fill="#f7eec6" stroke="#d4a72c"/><text class="in" x="344" y="98" text-anchor="middle">ds</text>

  <text class="lbl" x="8" y="140">wave 2</text><text class="wg" x="8" y="153">wgroup C</text>
  <rect x="392" y="126" width="56" height="22" fill="#cfe0f7" stroke="#3b7dd8"/><text class="in" x="420" y="142" text-anchor="middle">valu</text>
  <rect x="468" y="126" width="56" height="22" fill="#cfe0f7" stroke="#3b7dd8"/><text class="in" x="496" y="142" text-anchor="middle">valu</text>

  <rect class="box" x="380" y="118" width="156" height="38"/>
  <text class="bad" x="546" y="142">nothing holds this wave in phase</text>

  <text class="note" x="8" y="186">num_warps=4 puts one wave of a workgroup on each SIMD, so three resident workgroups give three</text>
  <text class="note" x="8" y="202">waves per SIMD. But each workgroup carries its own Q and accumulator, tripling the live-in that</text>
  <text class="note" x="8" y="218">cannot be shared (§4.3) — and `s_barrier` synchronizes within a workgroup, so there is no</text>
  <text class="note" x="8" y="234">primitive that keeps waves from three different workgroups in the phase relationship this needs.</text>
</svg>
