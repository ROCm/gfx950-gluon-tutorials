<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <style>
    .h    { font-size: 12.5px; font-weight: 600; fill: #767676; }
    .lbl  { font-size: 11.5px; fill: #767676; }
    .wg   { font-size: 10px; fill: #767676; }
    .in   { font-size: 10.5px; fill: #1a1a1a; }
    .note { font-size: 11.5px; fill: #767676; }
    .bad  { font-size: 11.5px; fill: #c8443c; }
    .col  { stroke: #c8c8c8; stroke-width: 1; stroke-dasharray: 2 3; }
    .box  { fill: none; stroke: #c8443c; stroke-width: 1.4; stroke-dasharray: 4 3; }
  </style>

  <text class="h" x="8" y="16">B. a stage of its own — every wave rotates through all three, so each slot has one of each</text>

  <text class="lbl" x="184" y="36" text-anchor="middle">slot 0</text>
  <text class="lbl" x="316" y="36" text-anchor="middle">slot 1</text>
  <text class="lbl" x="448" y="36" text-anchor="middle">slot 2</text>
  <text class="lbl" x="580" y="36" text-anchor="middle">slot 3</text>
  <line class="col" x1="250" y1="42" x2="250" y2="150"/>
  <line class="col" x1="382" y1="42" x2="382" y2="150"/>
  <line class="col" x1="514" y1="42" x2="514" y2="150"/>

  <text class="lbl" x="8" y="60">wave 0</text><text class="wg" x="8" y="72">wgroup A</text>
  <rect x="122" y="44" width="124" height="24" fill="#cde8d3" stroke="#4c9a5a"/><text class="in" x="184" y="60" text-anchor="middle">MFMA</text>
  <rect x="254" y="44" width="124" height="24" fill="#cfe0f7" stroke="#3b7dd8"/><text class="in" x="316" y="60" text-anchor="middle">VALU</text>
  <rect x="386" y="44" width="124" height="24" fill="#f7eec6" stroke="#d4a72c"/><text class="in" x="448" y="60" text-anchor="middle">ds</text>
  <rect x="518" y="44" width="124" height="24" fill="#cde8d3" stroke="#4c9a5a"/><text class="in" x="580" y="60" text-anchor="middle">MFMA</text>

  <text class="lbl" x="8" y="96">wave 1</text><text class="wg" x="8" y="108">wgroup B</text>
  <rect x="122" y="80" width="124" height="24" fill="#f7eec6" stroke="#d4a72c"/><text class="in" x="184" y="96" text-anchor="middle">ds</text>
  <rect x="254" y="80" width="124" height="24" fill="#cde8d3" stroke="#4c9a5a"/><text class="in" x="316" y="96" text-anchor="middle">MFMA</text>
  <rect x="386" y="80" width="124" height="24" fill="#cfe0f7" stroke="#3b7dd8"/><text class="in" x="448" y="96" text-anchor="middle">VALU</text>
  <rect x="518" y="80" width="124" height="24" fill="#f7eec6" stroke="#d4a72c"/><text class="in" x="580" y="96" text-anchor="middle">ds</text>

  <text class="lbl" x="8" y="132">wave 2</text><text class="wg" x="8" y="144">wgroup C</text>
  <rect x="122" y="116" width="124" height="24" fill="#cfe0f7" stroke="#3b7dd8"/><text class="in" x="184" y="132" text-anchor="middle">VALU</text>
  <rect x="254" y="116" width="124" height="24" fill="#f7eec6" stroke="#d4a72c"/><text class="in" x="316" y="132" text-anchor="middle">ds</text>
  <rect x="386" y="116" width="124" height="24" fill="#cde8d3" stroke="#4c9a5a"/><text class="in" x="448" y="132" text-anchor="middle">MFMA</text>
  <rect x="518" y="116" width="124" height="24" fill="#cfe0f7" stroke="#3b7dd8"/><text class="in" x="580" y="132" text-anchor="middle">VALU</text>

  <rect class="box" x="116" y="110" width="532" height="36"/>
  <text class="bad" x="654" y="132">3rd workgroup</text>

  <text class="note" x="8" y="180">In every slot the SIMD has an MFMA, a memory op and a VALU available, each from a different wave —</text>
  <text class="note" x="8" y="196">which is what §1's issue rule wants. The obstacle is supply. `num_warps=4` puts one wave of a</text>
  <text class="note" x="8" y="212">workgroup on each SIMD, so three waves means three resident workgroups, each carrying its own Q and</text>
  <text class="note" x="8" y="228">accumulator (§4.3: 96 VGPRs of live-in apiece). And `s_barrier` synchronizes *within* a workgroup, so</text>
  <text class="note" x="8" y="244">nothing can hold the three rotations in the phase relationship the picture depends on.</text>
</svg>
