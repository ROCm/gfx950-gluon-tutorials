<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 350" width="780" height="350" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <style>
    .h    { font-size: 13px; font-weight: 600; fill: #767676; }
    .lbl  { font-size: 12px; fill: #767676; }
    .in   { font-size: 11px; fill: #1a1a1a; }
    .note { font-size: 11.5px; fill: #767676; }
    .bad  { font-size: 11.5px; fill: #c8443c; }
    .good { font-size: 11.5px; fill: #2f7d43; }
  </style>

  <text class="h" x="8" y="18">Per-wave register budget — 32 of the 256 rows, so every tile is /64 lanes</text>
  <g transform="translate(8,28)">
    <rect x="0"   y="0" width="150" height="22" fill="#e6e6e6" stroke="#767676"/><text class="in" x="75" y="15" text-anchor="middle">Q  32x128/64/2 = 32</text>
    <rect x="0"   y="26" width="150" height="22" fill="#e6e6e6" stroke="#767676"/><text class="in" x="75" y="41" text-anchor="middle">acc (O)  32x128/64 = 64</text>
    <text class="note" x="158" y="15">live-in for the whole loop</text>
    <text class="note" x="158" y="41">= 96 VGPRs never freed</text>

    <rect x="0"   y="62" width="150" height="22" fill="#cfe0f7" stroke="#3b7dd8"/><text class="in" x="75" y="77" text-anchor="middle">VEC1 (QK tile) = 32</text>
    <rect x="0"   y="88" width="150" height="22" fill="#cfe0f7" stroke="#3b7dd8"/><text class="in" x="75" y="103" text-anchor="middle">VEC2 (QK tile) = 32</text>
    <rect x="0"   y="114" width="150" height="22" fill="#f7eec6" stroke="#d4a72c"/><text class="in" x="75" y="129" text-anchor="middle">LRK / LRV tile = 64</text>
    <text class="note" x="158" y="103">in-loop = 128 VGPRs</text>
    <text class="note" x="158" y="129">LRK and DOT1 are producer/consumer, so they share one buffer</text>

    <text class="note" x="0"  y="158">96 + 128 = 224 of 256, spill-free — and LDS is 2xK + 2xV = 64 KB.</text>
  </g>

  <!-- unroll -->
  <text class="h" x="8" y="216">Why the loop is unrolled 2x: the loop-carried buffers rotate</text>
  <g transform="translate(8,226)">
    <text class="lbl" x="0" y="20">1x</text>
    <rect x="30"  y="6"  width="96" height="22" fill="#cfe0f7" stroke="#3b7dd8"/><text class="in" x="78"  y="21" text-anchor="middle">VEC2 -&gt; buf0</text>
    <rect x="134" y="6"  width="96" height="22" fill="#cfe0f7" stroke="#3b7dd8"/><text class="in" x="182" y="21" text-anchor="middle">VEC1 -&gt; buf2</text>
    <text class="bad" x="244" y="21">next iteration needs VEC2 in buf0, but it is in buf2 — a copy every tile</text>

    <text class="lbl" x="0" y="60">2x</text>
    <rect x="30"  y="46" width="96" height="22" fill="#cfe0f7" stroke="#3b7dd8"/><text class="in" x="78"  y="61" text-anchor="middle">VEC2 -&gt; buf0</text>
    <rect x="134" y="46" width="96" height="22" fill="#cfe0f7" stroke="#3b7dd8"/><text class="in" x="182" y="61" text-anchor="middle">VEC1 -&gt; buf2</text>
    <rect x="238" y="46" width="96" height="22" fill="#cfe0f7" stroke="#3b7dd8"/><text class="in" x="286" y="61" text-anchor="middle">VEC2 -&gt; buf2</text>
    <rect x="342" y="46" width="96" height="22" fill="#cfe0f7" stroke="#3b7dd8"/><text class="in" x="390" y="61" text-anchor="middle">VEC1 -&gt; buf0</text>
    <text class="good" x="452" y="61">back where it started — no copy</text>
  </g>
  <text class="note" x="38" y="330">Unrolling also makes the double-buffer slot indices compile-time constants instead of runtime modulo arithmetic.</text>
</svg>
