<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" width="760" height="210" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <style>
    .h   { font-size: 12.5px; font-weight: 600; fill: #767676; }
    .lbl { font-size: 12px; fill: #767676; }
    .cyc { font-size: 11px; fill: #767676; }
    .in  { font-size: 11px; fill: #1a1a1a; }
    .note{ font-size: 11.5px; fill: #767676; }
    .bad { font-size: 11.5px; fill: #c8443c; }
    .gap { fill: #ececec; stroke: #b9b9b9; stroke-dasharray: 3 3; }
  </style>

  <text class="h" x="8" y="16">A. softmax in the mem stage — VALU and ds_read come from the same wave</text>

  <text class="cyc" x="120" y="42">cycle 0</text>
  <text class="cyc" x="196" y="42">8</text>
  <text class="cyc" x="258" y="42">12</text>
  <text class="cyc" x="320" y="42">16</text>
  <text class="cyc" x="382" y="42">20</text>
  <text class="cyc" x="444" y="42">24</text>
  <text class="cyc" x="506" y="42">28</text>
  <text class="cyc" x="568" y="42">32</text>

  <text class="lbl" x="8" y="66">wave 0</text>
  <text class="lbl" x="8" y="80">dot stage</text>
  <rect x="118" y="50" width="56" height="26" fill="#cde8d3" stroke="#4c9a5a"/>
  <text class="in" x="146" y="67" text-anchor="middle">MFMA</text>
  <rect class="gap" x="176" y="50" width="384" height="26"/>
  <text class="cyc" x="368" y="67" text-anchor="middle">matrix pipe busy — wave 0 issues nothing else</text>
  <rect x="562" y="50" width="56" height="26" fill="#cde8d3" stroke="#4c9a5a"/>
  <text class="in" x="590" y="67" text-anchor="middle">MFMA</text>

  <text class="lbl" x="8" y="110">wave 1</text>
  <text class="lbl" x="8" y="124">mem stage</text>
  <rect x="190" y="94" width="56" height="26" fill="#f7eec6" stroke="#d4a72c"/><text class="in" x="218" y="111" text-anchor="middle">ds</text>
  <rect x="252" y="94" width="56" height="26" fill="#cfe0f7" stroke="#3b7dd8"/><text class="in" x="280" y="111" text-anchor="middle">valu</text>
  <rect x="314" y="94" width="56" height="26" fill="#f7eec6" stroke="#d4a72c"/><text class="in" x="342" y="111" text-anchor="middle">ds</text>
  <rect x="376" y="94" width="56" height="26" fill="#cfe0f7" stroke="#3b7dd8"/><text class="in" x="404" y="111" text-anchor="middle">valu</text>
  <rect x="438" y="94" width="56" height="26" fill="#f7eec6" stroke="#d4a72c"/><text class="in" x="466" y="111" text-anchor="middle">ds</text>
  <rect x="500" y="94" width="56" height="26" fill="#cfe0f7" stroke="#3b7dd8"/><text class="in" x="528" y="111" text-anchor="middle">valu</text>

  <text class="bad"  x="118" y="150">One wave, one instruction per cycle: the ds_reads and the VALU take turns.</text>
  <text class="note" x="118" y="168">Six issue slots buy three loads and three VALU. The memory work and the softmax</text>
  <text class="note" x="118" y="184">are competing for the same slots even though the hardware could overlap them.</text>
</svg>
