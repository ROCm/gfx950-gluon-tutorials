<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <style>
    .h    { font-size: 12.5px; font-weight: 600; fill: #767676; }
    .lbl  { font-size: 11.5px; fill: #767676; }
    .in   { font-size: 10.5px; fill: #1a1a1a; }
    .note { font-size: 11.5px; fill: #767676; }
    .steady { fill: none; stroke: #c8443c; stroke-width: 2; }
    .sl   { font-size: 11.5px; fill: #c8443c; }
  </style>

  <text class="h" x="8" y="16">Software-pipelining the tile: each iteration's four stages march diagonally</text>

  <text class="lbl" x="120" y="40">t = 0</text>
  <text class="lbl" x="242" y="40">1</text>
  <text class="lbl" x="364" y="40">2</text>
  <text class="lbl" x="486" y="40">3</text>
  <text class="lbl" x="608" y="40">4</text>

  <text class="lbl" x="8" y="66">iter 0</text>
  <rect x="112" y="50" width="112" height="26" fill="#f7e0c6" stroke="#d9822b"/><text class="in" x="168" y="67" text-anchor="middle">ACK</text>
  <rect x="234" y="50" width="112" height="26" fill="#f7eec6" stroke="#d4a72c"/><text class="in" x="290" y="67" text-anchor="middle">LRK · ACV</text>
  <rect x="356" y="50" width="112" height="26" fill="#cde8d3" stroke="#4c9a5a"/><text class="in" x="412" y="67" text-anchor="middle">DOT1 · VEC1</text>
  <rect x="478" y="50" width="112" height="26" fill="#cde8d3" stroke="#4c9a5a"/><text class="in" x="534" y="67" text-anchor="middle">LRV·VEC2·DOT2</text>

  <text class="lbl" x="8" y="98">iter 1</text>
  <rect x="234" y="82" width="112" height="26" fill="#f7e0c6" stroke="#d9822b"/><text class="in" x="290" y="99" text-anchor="middle">ACK</text>
  <rect x="356" y="82" width="112" height="26" fill="#f7eec6" stroke="#d4a72c"/><text class="in" x="412" y="99" text-anchor="middle">LRK · ACV</text>
  <rect x="478" y="82" width="112" height="26" fill="#cde8d3" stroke="#4c9a5a"/><text class="in" x="534" y="99" text-anchor="middle">DOT1 · VEC1</text>
  <rect x="600" y="82" width="112" height="26" fill="#cde8d3" stroke="#4c9a5a"/><text class="in" x="656" y="99" text-anchor="middle">LRV·VEC2·DOT2</text>

  <text class="lbl" x="8" y="130">iter 2</text>
  <rect x="356" y="114" width="112" height="26" fill="#f7e0c6" stroke="#d9822b"/><text class="in" x="412" y="131" text-anchor="middle">ACK</text>
  <rect x="478" y="114" width="112" height="26" fill="#f7eec6" stroke="#d4a72c"/><text class="in" x="534" y="131" text-anchor="middle">LRK · ACV</text>
  <rect x="600" y="114" width="112" height="26" fill="#cde8d3" stroke="#4c9a5a"/><text class="in" x="656" y="131" text-anchor="middle">DOT1 · VEC1</text>

  <text class="lbl" x="8" y="162">iter 3</text>
  <rect x="478" y="146" width="112" height="26" fill="#f7e0c6" stroke="#d9822b"/><text class="in" x="534" y="163" text-anchor="middle">ACK</text>
  <rect x="600" y="146" width="112" height="26" fill="#f7eec6" stroke="#d4a72c"/><text class="in" x="656" y="163" text-anchor="middle">LRK · ACV</text>

  <rect class="steady" x="472" y="44" width="124" height="134"/>
  <text class="sl" x="404" y="196">the loop body is one vertical slice</text>

  <text class="note" x="8" y="226">At t = 3 the wave runs LRV·VEC2·DOT2 of tile j, DOT1·VEC1 of tile j+1, LRK·ACV of tile j+2 and ACK of tile j+3</text>
  <text class="note" x="8" y="244">— four different tiles in flight, which is what lets the copies of a future tile overlap the matrix work of this one.</text>
  <text class="note" x="8" y="270">The cost is that everything is skewed: an op's tile index tells you how far ahead of the current tile it runs.</text>
</svg>
