<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <style>
    .h    { font-size: 12.5px; font-weight: 600; fill: #767676; }
    .row  { font-size: 11px; fill: #767676; }
    .cell { font-size: 9.5px; fill: #1a1a1a; }
    .ph   { font-size: 11.5px; font-weight: 600; fill: #767676; }
    .body { fill: none; stroke: #c8443c; stroke-width: 2; }
    .bl   { font-size: 11px; fill: #c8443c; }
    .reg  { stroke: #b9b9b9; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
  </style>

  <text class="h" x="8" y="16">The four stages, filling and draining</text>

  <rect class="reg" x="130" y="36" width="200" height="150"/>
  <rect class="reg" x="332" y="36" width="200" height="150"/>
  <rect class="reg" x="534" y="36" width="200" height="150"/>
  <text class="ph" x="230" y="32" text-anchor="middle">prologue</text>
  <text class="ph" x="432" y="32" text-anchor="middle">main loop</text>
  <text class="ph" x="634" y="32" text-anchor="middle">drain</text>

  <text class="row" x="8" y="58">stage 0</text>
  <text class="row" x="8" y="94">stage 1</text>
  <text class="row" x="8" y="130">stage 2</text>
  <text class="row" x="8" y="166">stage 3</text>

  <!-- prologue -->
  <rect x="136" y="44" width="62" height="22" fill="#f7e0c6" stroke="#d9822b"/><text class="cell" x="167" y="59" text-anchor="middle">ACK[0]</text>
  <rect x="202" y="44" width="62" height="22" fill="#f7e0c6" stroke="#d9822b"/><text class="cell" x="233" y="59" text-anchor="middle">ACK[1]</text>
  <rect x="268" y="44" width="62" height="22" fill="#f7e0c6" stroke="#d9822b"/><text class="cell" x="299" y="59" text-anchor="middle">ACK[2]</text>
  <rect x="202" y="80" width="62" height="22" fill="#f7eec6" stroke="#d4a72c"/><text class="cell" x="233" y="95" text-anchor="middle">LRK[0]</text>
  <rect x="268" y="80" width="62" height="22" fill="#f7eec6" stroke="#d4a72c"/><text class="cell" x="299" y="95" text-anchor="middle">LRK[1]</text>
  <rect x="268" y="116" width="62" height="22" fill="#cde8d3" stroke="#4c9a5a"/><text class="cell" x="299" y="131" text-anchor="middle">DOT1[0]</text>

  <!-- main loop -->
  <rect x="338" y="44" width="62" height="22" fill="#f7e0c6" stroke="#d9822b"/><text class="cell" x="369" y="59" text-anchor="middle">ACK[3]</text>
  <rect x="404" y="44" width="62" height="22" fill="#f7e0c6" stroke="#d9822b"/><text class="cell" x="435" y="59" text-anchor="middle">ACK[4]</text>
  <rect x="470" y="44" width="62" height="22" fill="#f7e0c6" stroke="#d9822b"/><text class="cell" x="501" y="59" text-anchor="middle">ACK[5]</text>
  <rect x="338" y="80" width="62" height="22" fill="#f7eec6" stroke="#d4a72c"/><text class="cell" x="369" y="95" text-anchor="middle">LRK[2]</text>
  <rect x="404" y="80" width="62" height="22" fill="#f7eec6" stroke="#d4a72c"/><text class="cell" x="435" y="95" text-anchor="middle">LRK[3]</text>
  <rect x="470" y="80" width="62" height="22" fill="#f7eec6" stroke="#d4a72c"/><text class="cell" x="501" y="95" text-anchor="middle">LRK[4]</text>
  <rect x="338" y="116" width="62" height="22" fill="#cde8d3" stroke="#4c9a5a"/><text class="cell" x="369" y="131" text-anchor="middle">DOT1[1]</text>
  <rect x="404" y="116" width="62" height="22" fill="#cde8d3" stroke="#4c9a5a"/><text class="cell" x="435" y="131" text-anchor="middle">DOT1[2]</text>
  <rect x="470" y="116" width="62" height="22" fill="#cde8d3" stroke="#4c9a5a"/><text class="cell" x="501" y="131" text-anchor="middle">DOT1[3]</text>
  <rect x="338" y="152" width="62" height="22" fill="#cde8d3" stroke="#4c9a5a"/><text class="cell" x="369" y="167" text-anchor="middle">DOT2[0]</text>
  <rect x="404" y="152" width="62" height="22" fill="#cde8d3" stroke="#4c9a5a"/><text class="cell" x="435" y="167" text-anchor="middle">DOT2[1]</text>
  <rect x="470" y="152" width="62" height="22" fill="#cde8d3" stroke="#4c9a5a"/><text class="cell" x="501" y="167" text-anchor="middle">DOT2[2]</text>

  <!-- drain -->
  <rect x="540" y="80" width="62" height="22" fill="#f7eec6" stroke="#d4a72c"/><text class="cell" x="571" y="95" text-anchor="middle">LRK[5]</text>
  <rect x="540" y="116" width="62" height="22" fill="#cde8d3" stroke="#4c9a5a"/><text class="cell" x="571" y="131" text-anchor="middle">DOT1[4]</text>
  <rect x="606" y="116" width="62" height="22" fill="#cde8d3" stroke="#4c9a5a"/><text class="cell" x="637" y="131" text-anchor="middle">DOT1[5]</text>
  <rect x="540" y="152" width="62" height="22" fill="#cde8d3" stroke="#4c9a5a"/><text class="cell" x="571" y="167" text-anchor="middle">DOT2[3]</text>
  <rect x="606" y="152" width="62" height="22" fill="#cde8d3" stroke="#4c9a5a"/><text class="cell" x="637" y="167" text-anchor="middle">DOT2[4]</text>
  <rect x="672" y="152" width="62" height="22" fill="#cde8d3" stroke="#4c9a5a"/><text class="cell" x="703" y="167" text-anchor="middle">DOT2[5]</text>

  <rect class="body" x="332" y="38" width="72" height="146"/>
  <text class="bl" x="332" y="200">one iteration</text>

  <text class="row" x="8" y="228">stage 0 = ACK · stage 1 = ACV, LRK · stage 2 = DOT1, VEC1 · stage 3 = VEC2, LRV, DOT2</text>
  <text class="row" x="8" y="244">(one op per stage shown; the tile index is the tile that stage is working on)</text>
</svg>
