<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <style>
    .h    { font-size: 12.5px; font-weight: 600; fill: #767676; }
    .row  { font-size: 11px; fill: #767676; }
    .cell { font-size: 11px; fill: #1a1a1a; }
    .note { font-size: 11.5px; fill: #767676; }
    .ph   { font-size: 11.5px; font-weight: 600; fill: #767676; }
    .body { fill: none; stroke: #c8443c; stroke-width: 2; }
    .bl   { font-size: 11px; fill: #c8443c; }
    .diag { fill: none; stroke: #3b7dd8; stroke-width: 1.6; stroke-dasharray: 4 3; }
    .dl   { font-size: 11px; fill: #3b7dd8; }
    .reg  { stroke: #b9b9b9; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
  </style>

  <text class="h" x="8" y="16">The same four stages, filling and draining. Cells hold the tile index each stage is working on.</text>

  <!-- phase brackets -->
  <rect class="reg" x="222" y="34" width="180" height="146"/>
  <rect class="reg" x="402" y="34" width="180" height="146"/>
  <rect class="reg" x="582" y="34" width="176" height="146"/>
  <text class="ph" x="312" y="30" text-anchor="middle">prologue</text>
  <text class="ph" x="492" y="30" text-anchor="middle">main loop</text>
  <text class="ph" x="670" y="30" text-anchor="middle">drain</text>

  <text class="row" x="8" y="58">stage 0   ACK</text>
  <text class="row" x="8" y="94">stage 1   ACV · LRK</text>
  <text class="row" x="8" y="130">stage 2   DOT1 · VEC1</text>
  <text class="row" x="8" y="166">stage 3   VEC2 · LRV · DOT2</text>

  <!-- prologue: t=0,1,2 -->
  <rect x="232" y="42" width="46" height="22" fill="#f7e0c6" stroke="#d9822b"/><text class="cell" x="255" y="58" text-anchor="middle">0</text>
  <rect x="292" y="42" width="46" height="22" fill="#f7e0c6" stroke="#d9822b"/><text class="cell" x="315" y="58" text-anchor="middle">1</text>
  <rect x="352" y="42" width="46" height="22" fill="#f7e0c6" stroke="#d9822b"/><text class="cell" x="375" y="58" text-anchor="middle">2</text>
  <rect x="292" y="78" width="46" height="22" fill="#f7eec6" stroke="#d4a72c"/><text class="cell" x="315" y="94" text-anchor="middle">0</text>
  <rect x="352" y="78" width="46" height="22" fill="#f7eec6" stroke="#d4a72c"/><text class="cell" x="375" y="94" text-anchor="middle">1</text>
  <rect x="352" y="114" width="46" height="22" fill="#cde8d3" stroke="#4c9a5a"/><text class="cell" x="375" y="130" text-anchor="middle">0</text>

  <!-- main loop: t=3,4,5 -->
  <rect x="412" y="42" width="46" height="22" fill="#f7e0c6" stroke="#d9822b"/><text class="cell" x="435" y="58" text-anchor="middle">3</text>
  <rect x="472" y="42" width="46" height="22" fill="#f7e0c6" stroke="#d9822b"/><text class="cell" x="495" y="58" text-anchor="middle">4</text>
  <rect x="532" y="42" width="46" height="22" fill="#f7e0c6" stroke="#d9822b"/><text class="cell" x="555" y="58" text-anchor="middle">5</text>
  <rect x="412" y="78" width="46" height="22" fill="#f7eec6" stroke="#d4a72c"/><text class="cell" x="435" y="94" text-anchor="middle">2</text>
  <rect x="472" y="78" width="46" height="22" fill="#f7eec6" stroke="#d4a72c"/><text class="cell" x="495" y="94" text-anchor="middle">3</text>
  <rect x="532" y="78" width="46" height="22" fill="#f7eec6" stroke="#d4a72c"/><text class="cell" x="555" y="94" text-anchor="middle">4</text>
  <rect x="412" y="114" width="46" height="22" fill="#cde8d3" stroke="#4c9a5a"/><text class="cell" x="435" y="130" text-anchor="middle">1</text>
  <rect x="472" y="114" width="46" height="22" fill="#cde8d3" stroke="#4c9a5a"/><text class="cell" x="495" y="130" text-anchor="middle">2</text>
  <rect x="532" y="114" width="46" height="22" fill="#cde8d3" stroke="#4c9a5a"/><text class="cell" x="555" y="130" text-anchor="middle">3</text>
  <rect x="412" y="150" width="46" height="22" fill="#cde8d3" stroke="#4c9a5a"/><text class="cell" x="435" y="166" text-anchor="middle">0</text>
  <rect x="472" y="150" width="46" height="22" fill="#cde8d3" stroke="#4c9a5a"/><text class="cell" x="495" y="166" text-anchor="middle">1</text>
  <rect x="532" y="150" width="46" height="22" fill="#cde8d3" stroke="#4c9a5a"/><text class="cell" x="555" y="166" text-anchor="middle">2</text>

  <!-- drain: t=6,7,8 -->
  <rect x="592" y="78" width="46" height="22" fill="#f7eec6" stroke="#d4a72c"/><text class="cell" x="615" y="94" text-anchor="middle">5</text>
  <rect x="592" y="114" width="46" height="22" fill="#cde8d3" stroke="#4c9a5a"/><text class="cell" x="615" y="130" text-anchor="middle">4</text>
  <rect x="652" y="114" width="46" height="22" fill="#cde8d3" stroke="#4c9a5a"/><text class="cell" x="675" y="130" text-anchor="middle">5</text>
  <rect x="592" y="150" width="46" height="22" fill="#cde8d3" stroke="#4c9a5a"/><text class="cell" x="615" y="166" text-anchor="middle">3</text>
  <rect x="652" y="150" width="46" height="22" fill="#cde8d3" stroke="#4c9a5a"/><text class="cell" x="675" y="166" text-anchor="middle">4</text>
  <rect x="712" y="150" width="46" height="22" fill="#cde8d3" stroke="#4c9a5a"/><text class="cell" x="735" y="166" text-anchor="middle">5</text>

  <rect class="body" x="406" y="36" width="58" height="142"/>
  <text class="bl" x="406" y="190">one iteration</text>

  <path class="diag" d="M 278,53 L 292,53 L 292,89 L 352,89 L 352,125 L 412,125 L 412,161 L 464,161"/>
  <text class="dl" x="470" y="196">tile 0 descends one stage per iteration</text>

  <text class="note" x="8" y="228">Only the middle is the loop. The prologue fills the pipe — three columns where the later stages have no tile</text>
  <text class="note" x="8" y="244">yet — and the drain empties it, finishing the last tiles with no copies left to issue. Both are straight-line</text>
  <text class="note" x="8" y="260">code outside the loop, which is why they show up separately in a trace as the prologue and epilogue ratios.</text>
  <text class="note" x="8" y="284">The deeper the pipeline, the more tiles it takes to fill and drain — four stages costs three columns at each end.</text>
</svg>
