<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" width="780" height="300" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <style>
    .h    { font-size: 13px; font-weight: 600; fill: #767676; }
    .lbl  { font-size: 12px; fill: #767676; }
    .in   { font-size: 11px; fill: #1a1a1a; }
    .note { font-size: 11.5px; fill: #767676; }
    .bad  { font-size: 11.5px; fill: #c8443c; }
    .good { font-size: 11.5px; fill: #2f7d43; }
    .ax   { stroke: #767676; stroke-width: 1; }
  </style>

  <text class="h" x="8" y="18">Only MFMA issues freely. Everything else must fit in the shadow it casts —</text>
  <text class="h" x="8" y="35">and a wave issues at most one instruction per cycle.</text>

  <!-- option A: VALU together with mem (one wave) -->
  <text class="h"   x="8" y="70">A. VALU in the mem stage</text>
  <text class="bad" x="200" y="70">same wave -> they serialize -> two shadow cycles for two instructions</text>

  <g transform="translate(8,80)">
    <text class="lbl" x="0" y="21">wave 0</text>
    <rect x="58" y="6" width="240" height="22" fill="#cde8d3" stroke="#4c9a5a"/>
    <text class="in" x="178" y="21" text-anchor="middle">MFMA (shadow)</text>
    <text class="lbl" x="0" y="49">wave 1</text>
    <rect x="58"  y="34" width="52" height="22" fill="#f7eec6" stroke="#d4a72c"/>
    <text class="in" x="84"  y="49" text-anchor="middle">ds</text>
    <rect x="112" y="34" width="52" height="22" fill="#cfe0f7" stroke="#3b7dd8"/>
    <text class="in" x="138" y="49" text-anchor="middle">valu</text>
    <rect x="166" y="34" width="52" height="22" fill="#f7eec6" stroke="#d4a72c"/>
    <text class="in" x="192" y="49" text-anchor="middle">ds</text>
    <rect x="220" y="34" width="52" height="22" fill="#cfe0f7" stroke="#3b7dd8"/>
    <text class="in" x="246" y="49" text-anchor="middle">valu</text>
    <text class="note" x="312" y="49">4 instructions, 4 cycles of shadow</text>
  </g>

  <!-- option B: VALU with mfma (different waves) -->
  <text class="h"    x="8" y="172">B. VALU in the dot stage</text>
  <text class="good" x="200" y="172">different waves, different issue ports -> both issue in the same cycle</text>

  <g transform="translate(8,182)">
    <text class="lbl" x="0" y="21">wave 0</text>
    <rect x="58" y="6" width="240" height="22" fill="#cde8d3" stroke="#4c9a5a"/>
    <text class="in" x="178" y="21" text-anchor="middle">MFMA (shadow)</text>
    <!-- valu from the mfma wave itself, drawn just under the mfma bar -->
    <rect x="58"  y="34" width="52" height="22" fill="#cfe0f7" stroke="#3b7dd8"/>
    <text class="in" x="84"  y="49" text-anchor="middle">valu</text>
    <rect x="112" y="34" width="52" height="22" fill="#cfe0f7" stroke="#3b7dd8"/>
    <text class="in" x="138" y="49" text-anchor="middle">valu</text>

    <text class="lbl" x="0" y="77">wave 1</text>
    <rect x="58"  y="62" width="52" height="22" fill="#f7eec6" stroke="#d4a72c"/>
    <text class="in" x="84"  y="77" text-anchor="middle">ds</text>
    <rect x="112" y="62" width="52" height="22" fill="#f7eec6" stroke="#d4a72c"/>
    <text class="in" x="138" y="77" text-anchor="middle">ds</text>

    <!-- pairing brackets -->
    <line class="ax" x1="84"  y1="56" x2="84"  y2="62"/>
    <line class="ax" x1="138" y1="56" x2="138" y2="62"/>
    <text class="note" x="312" y="63">4 instructions, 2 cycles of shadow — one cycle does two</text>
  </g>

  <text class="note" x="8" y="285">VALU, LDS and VMEM are separate issue ports: the SIMD issues one of each per cycle, never two from one wave.</text>
</svg>
