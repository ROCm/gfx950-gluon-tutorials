  <text class="ok" x="640" y="164">is untouched</text>
  <text class="note" x="8" y="212">Each box is one loop iteration of two K/V tiles. The four diagonal tiles are masked in the last iterations and the drain.</text>
  <text class="st" x="8" y="250">Why: one PV cluster (dot2) as issued -- 16 PV MFMAs with the softmax VALU of the next tile (schematic)</text>
  <text class="lbl" x="112" y="285" text-anchor="end">branch-free</text>
