<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <style>
    .h    { font-size: 12.5px; font-weight: 600; fill: #767676; }
    .p    { font-size: 12px; font-weight: 600; fill: #767676; }
    .lbl  { font-size: 11.5px; fill: #767676; }
    .seg  { font-size: 10.5px; fill: #1a1a1a; }
    .note { font-size: 11px; fill: #767676; }
    .over { font-size: 11px; fill: #c8443c; }
    .ok   { font-size: 11px; fill: #2f7d43; }
    .win  { fill: none; stroke: #767676; stroke-width: 1.4; }
  </style>

  <text class="h" x="8" y="16">Each dot cluster has 16 MFMA x 24 = 384 cycles of shadow. What the softmax asks of it:</text>

  <!-- scale: 384 cyc -> 440 px, bars start at x=120, window edge at 560 -->
  <line x1="560" y1="30" x2="560" y2="356" stroke="#767676" stroke-width="1" stroke-dasharray="3 3"/>
  <text class="lbl" x="560" y="28" text-anchor="middle">384</text>

  <!-- panel 1 -->
  <text class="p"   x="8" y="52">fav3</text>
  <text class="lbl" x="8" y="68">rescale</text>
  <text class="lbl" x="8" y="82">every tile</text>

  <text class="lbl" x="112" y="60" text-anchor="end">QK</text>
  <rect x="120"   y="44" width="73.3"  height="22" fill="#cfe0f7" stroke="#3b7dd8"/><text class="seg" x="157" y="59" text-anchor="middle">cvt 64</text>
  <rect x="193.3" y="44" width="146.7" height="22" fill="#cfe0f7" stroke="#3b7dd8"/><text class="seg" x="267" y="59" text-anchor="middle">sum 128</text>
  <rect x="340"   y="44" width="293.3" height="22" fill="#f7d2cf" stroke="#c8443c"/><text class="seg" x="487" y="59" text-anchor="middle">rescale 256</text>
  <rect class="win" x="120" y="44" width="440" height="22"/>
  <text class="over" x="644" y="59">448 / 384</text>

  <text class="lbl" x="112" y="92" text-anchor="end">PV</text>
  <rect x="120"   y="76" width="73.3"  height="22" fill="#cfe0f7" stroke="#3b7dd8"/><text class="seg" x="157" y="91" text-anchor="middle">max 64</text>
  <rect x="193.3" y="76" width="146.7" height="22" fill="#cfe0f7" stroke="#3b7dd8"/><text class="seg" x="267" y="91" text-anchor="middle">fma 128</text>
  <rect x="340"   y="76" width="293.3" height="22" fill="#ded3f5" stroke="#7a5ac9"/><text class="seg" x="487" y="91" text-anchor="middle">exp 256</text>
  <rect class="win" x="120" y="76" width="440" height="22"/>
  <text class="over" x="644" y="91">448 / 384</text>
  <text class="note" x="120" y="116">Both over capacity. Whatever will not fit is issued in the open, and costs cycles.</text>

  <!-- panel 2 -->
  <text class="p"   x="8" y="164">fav4</text>
  <text class="lbl" x="8" y="180">lazy</text>
  <text class="lbl" x="8" y="194">rescale</text>

  <text class="lbl" x="112" y="172" text-anchor="end">QK</text>
  <rect x="120"   y="156" width="73.3"  height="22" fill="#cfe0f7" stroke="#3b7dd8"/><text class="seg" x="157" y="171" text-anchor="middle">cvt 64</text>
  <rect x="193.3" y="156" width="146.7" height="22" fill="#cfe0f7" stroke="#3b7dd8"/><text class="seg" x="267" y="171" text-anchor="middle">sum 128</text>
  <rect class="win" x="120" y="156" width="440" height="22"/>
  <text class="ok" x="644" y="171">192 / 384</text>

  <text class="lbl" x="112" y="204" text-anchor="end">PV</text>
  <rect x="120"   y="188" width="73.3"  height="22" fill="#cfe0f7" stroke="#3b7dd8"/><text class="seg" x="157" y="203" text-anchor="middle">max 64</text>
  <rect x="193.3" y="188" width="146.7" height="22" fill="#cfe0f7" stroke="#3b7dd8"/><text class="seg" x="267" y="203" text-anchor="middle">fma 128</text>
  <rect x="340"   y="188" width="293.3" height="22" fill="#ded3f5" stroke="#7a5ac9"/><text class="seg" x="487" y="203" text-anchor="middle">exp 256</text>
  <rect class="win" x="120" y="188" width="440" height="22"/>
  <text class="over" x="644" y="203">448 / 384</text>
  <text class="note" x="120" y="228">Dropping the rescale empties QK; PV is untouched and still over. Badly unbalanced.</text>

  <!-- panel 3 -->
  <text class="p"   x="8" y="276">fav4</text>
  <text class="lbl" x="8" y="292">after</text>
  <text class="lbl" x="8" y="306">balancing</text>

  <text class="lbl" x="112" y="284" text-anchor="end">QK</text>
  <rect x="120"   y="268" width="73.3"  height="22" fill="#cfe0f7" stroke="#3b7dd8"/><text class="seg" x="157" y="283" text-anchor="middle">cvt 64</text>
  <rect x="193.3" y="268" width="146.7" height="22" fill="#cfe0f7" stroke="#3b7dd8"/><text class="seg" x="267" y="283" text-anchor="middle">sum 128</text>
  <rect x="340"   y="268" width="55.0"  height="22" fill="#cfe0f7" stroke="#3b7dd8"/><text class="seg" x="368" y="283" text-anchor="middle">fma 48</text>
  <rect x="395"   y="268" width="110.0" height="22" fill="#ded3f5" stroke="#7a5ac9"/><text class="seg" x="450" y="283" text-anchor="middle">exp 96</text>
  <rect class="win" x="120" y="268" width="440" height="22"/>
  <text class="ok" x="644" y="283">336 / 384</text>

  <text class="lbl" x="112" y="316" text-anchor="end">PV</text>
  <rect x="120"   y="300" width="73.3"  height="22" fill="#cfe0f7" stroke="#3b7dd8"/><text class="seg" x="157" y="315" text-anchor="middle">max 64</text>
  <rect x="193.3" y="300" width="91.7"  height="22" fill="#cfe0f7" stroke="#3b7dd8"/><text class="seg" x="239" y="315" text-anchor="middle">fma 80</text>
  <rect x="285"   y="300" width="183.3" height="22" fill="#ded3f5" stroke="#7a5ac9"/><text class="seg" x="377" y="315" text-anchor="middle">exp 160</text>
  <rect class="win" x="120" y="300" width="440" height="22"/>
  <text class="ok" x="644" y="315">304 / 384</text>
  <text class="note" x="120" y="340">Moving 3/8 of the subtract and the exp2 together brings both inside, with room to spare.</text>

  <g transform="translate(120,364)">
    <rect x="0"   y="0" width="12" height="12" fill="#cfe0f7" stroke="#3b7dd8"/><text class="note" x="18" y="10">VALU, 4 cyc each</text>
    <rect x="130" y="0" width="12" height="12" fill="#ded3f5" stroke="#7a5ac9"/><text class="note" x="148" y="10">TRANS, 8 cyc each</text>
    <rect x="270" y="0" width="12" height="12" fill="#f7d2cf" stroke="#c8443c"/><text class="note" x="288" y="10">the accumulator rescale — 64 VALU</text>
  </g>
</svg>
